<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borvo Rov</title>
<meta name="theme-color" content="#0b0a0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Fraktur";src:url(fonts/unifrakturmaguntia-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Pirata";src:url(fonts/pirata-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Garamond";src:url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Garamond";src:url(fonts/eb-garamond-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Garamond";src:url(fonts/eb-garamond-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
/* Gothic reliquary: black stone and iron, gold leaf, blood-crimson glass. Single dark theme by choice. */
:root{
  --void:#0b0a0c; --stone:#151317; --panel:#1b181c; --panel2:#231f24; --ink:#e4d9c1; --muted:#9a8d76; --line:#4a3f2c;
  --gold:#b48a32; --gold2:#e2bd62; --crimson:#8e1426; --blood:#5a0a15; --field:rgba(0,0,0,.35);
  --display:"Fraktur","UnifrakturMaguntia",serif; --gothic:"Pirata","Fraktur",serif; --body:"Garamond","EB Garamond",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;background-color:var(--void);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .4 0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    repeating-linear-gradient(0deg,rgba(0,0,0,.6) 0 2px,transparent 2px 84px),
    radial-gradient(ellipse at 50% -10%,#2a1c22,#0b0a0c 70%);
  min-height:100vh;
}
.scroll{max-width:1180px;margin:0 auto;padding:6px 16px 110px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
input,textarea,select{font:inherit;color:var(--ink);background:var(--field);border:none;border-bottom:1px solid var(--line);border-radius:0;padding:3px 6px;width:100%;min-width:0}
select option{background:#151317;color:var(--ink)}
textarea{resize:vertical;min-height:70px;line-height:1.4;border:1px solid var(--line)}
input::placeholder,textarea::placeholder{color:#6d6150;font-style:italic}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:1px solid var(--gold2);outline-offset:1px;background:rgba(180,138,50,.08)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--crimson);padding:0;flex:none}
input[type=number]{font-variant-numeric:tabular-nums}
button,.btnlike{font-family:var(--gothic);font-size:17px;letter-spacing:.03em;cursor:pointer;border:1px solid var(--gold);background:linear-gradient(#2a2428,#151217);color:var(--gold2);border-radius:0;padding:4px 12px;box-shadow:inset 0 1px 0 rgba(226,189,98,.15)}
button.primary{background:linear-gradient(#e2bd62,#8a6420);border-color:#5e4313;color:#120d07}
button.mini{padding:1px 10px}
button.x{border:none;background:none;color:var(--muted);font-size:21px;padding:0 4px;line-height:1;box-shadow:none;font-family:var(--body)}
button.x:hover{color:#e05a6a}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#0d0b0e,#060506);color:var(--gold2);border-bottom:1px solid var(--gold);box-shadow:0 1px 0 #000,0 4px 18px rgba(0,0,0,.9);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-in .grow{flex:1}
.brand{font-family:var(--display);font-size:26px;color:var(--gold2);text-shadow:0 0 12px rgba(226,189,98,.3)}
.pill{font-family:var(--body);font-size:14px;padding:1px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--gold2)}.pill.bad{color:#ff8a8a}
.hero{display:grid;gap:12px;padding:26px 0 20px;text-align:center}
.hero .name input{font-family:var(--display);font-size:clamp(46px,11vw,84px);text-align:center;background:none;border:none;color:var(--gold2);padding:0;
  text-shadow:0 2px 0 #000,0 0 24px rgba(226,189,98,.35),0 0 2px #5e4313}
.hero .rule{height:12px;margin:0 auto;width:min(560px,86%);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);position:relative;
  background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(180,138,50,.35) 10px 11px)}
.hero .rule::after{content:"✠";position:absolute;left:50%;top:-15px;transform:translateX(-50%);background:var(--void);color:var(--crimson);padding:0 12px;font-size:26px;text-shadow:0 0 10px rgba(142,20,38,.8)}
.hero .meta .f label{color:var(--gold)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;text-align:left}
.f{display:flex;flex-direction:column;gap:1px}
.f label,.lbl{font-family:var(--gothic);font-size:15px;letter-spacing:.04em;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{
  padding:20px 16px 18px;display:flex;flex-direction:column;gap:10px;position:relative;
  background-color:var(--panel);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .5 0 0 0 0 .35 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 50% 0,rgba(142,20,38,.14),transparent 60%),
    linear-gradient(#1f1b20,#141215);
  border:1px solid var(--gold);
  border-radius:46px 46px 2px 2px/22px 22px 2px 2px;
  box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px rgba(180,138,50,.4),inset 0 0 60px rgba(0,0,0,.75),0 10px 26px rgba(0,0,0,.85);
}
.card::before,.card::after{content:"✠";position:absolute;color:var(--gold);font-size:14px;line-height:1;opacity:.85}
.card::before{bottom:6px;left:8px}.card::after{bottom:6px;right:8px}
.card h2{font-family:var(--display);font-size:30px;color:var(--gold2);display:flex;align-items:center;gap:12px;text-shadow:0 2px 0 #000,0 0 14px rgba(226,189,98,.22)}
.card h2::before{content:"";width:14px;height:14px;flex:none;background:var(--crimson);transform:rotate(45deg);box-shadow:0 0 8px rgba(142,20,38,.9),inset 0 0 0 1px #e2bd62}
.card h2::after{content:"";flex:1;height:3px;border-top:1px solid var(--gold);border-bottom:1px solid rgba(180,138,50,.35)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:980px){.c3,.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
@media (max-width:640px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.abils{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:640px){.abils{grid-template-columns:repeat(3,1fr)}}
.ab{display:flex;flex-direction:column;align-items:center;gap:4px}
.ab .sh{width:100%;max-width:132px;padding:3px;background:linear-gradient(160deg,#f0cf78,#7a5a1b 55%,#e2bd62);clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.ab .in{background:radial-gradient(ellipse at 50% 20%,#3a1018,#160a0d 75%);clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%);padding:8px 6px 36px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ab .lbl{font-size:13px;color:var(--gold2)}
.ab .mod{font-family:var(--display);font-size:34px;color:var(--gold2);line-height:1.05;text-shadow:0 2px 0 #000}
.ab input[type=number]{text-align:center;width:52px;border:1px solid var(--gold);background:rgba(0,0,0,.45)}
.ab .save{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.stat{border:1px solid var(--line);padding:6px;text-align:center;background:rgba(0,0,0,.3);display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 0 0 1px rgba(180,138,50,.15)}
.stat .big{font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums;color:var(--gold2);line-height:1.1;text-shadow:0 2px 0 #000}
.stat input{text-align:center}
.acbox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);padding:8px;background:rgba(0,0,0,.2)}
.acitem{display:grid;grid-template-columns:auto 1fr 90px 58px 24px;gap:6px;align-items:center}
.acitem select{padding:3px}
.wear{min-width:74px;font-size:15px}
.wear.on{background:linear-gradient(#e2bd62,#8a6420);border-color:#5e4313;color:#120d07}
.hp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hptotal{font-family:var(--display);font-size:28px;color:var(--gold2);line-height:1.1}
.hpbar{height:22px;border:3px solid #050405;background:#050405;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(142,20,38,.35),inset 0 0 6px #000}
.hpbar i{display:block;height:100%;transition:width .4s;
  background:
    linear-gradient(rgba(255,210,210,.28),transparent 45%,rgba(0,0,0,.35)),
    repeating-linear-gradient(90deg,#8e1426 0 22px,#b3203a 22px 36px,#5a0a15 36px 52px,#050405 52px 55px);}
.hpbar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(5,4,5,.9) 7px 8px);pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pips{display:flex;gap:4px;align-items:center}
.skills{display:grid;gap:1px}
.sk{display:grid;grid-template-columns:42px 1fr 46px 56px;gap:6px;align-items:center;padding:2px 4px;min-height:38px}
.sk:nth-child(odd){background:rgba(255,255,255,.03)}
.sk .tot{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--gold2)}
.sk .ab3{font-size:12px;color:var(--muted);font-variant:small-caps}
.sk input{padding:1px 3px;text-align:center}
.sk .prof{padding:2px 0;font-size:15px;min-height:30px}
.sk .prof.on{border-color:var(--gold2)}
.sk .prof.ex{background:linear-gradient(#e2bd62,#8a6420);border-color:#5e4313;color:#120d07}
.sk.p .nm{font-weight:700}.sk.e .nm{font-weight:700;color:var(--gold2)}
.tbl{display:flex;flex-direction:column;gap:5px}
.tr{display:grid;gap:6px;align-items:center}
.tr.attack{grid-template-columns:1.4fr .7fr .6fr 1.3fr 1.6fr 24px}
.tr.head{font-family:var(--gothic);font-size:15px;color:var(--gold)}
.hpamt{width:110px!important}
button.dmg{background:linear-gradient(#a3192f,#5a0a15);border-color:#3a050c;color:#f3d9b5}
button.heal{background:linear-gradient(#5b6a3f,#2f3a20);border-color:#202813;color:#efe2c2}
.feat{border-left:2px solid var(--crimson);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.feat .row{flex-wrap:nowrap}
.feat .row input{font-family:var(--gothic);color:var(--gold2);font-size:19px}
.spell{display:grid;grid-template-columns:24px 1fr 70px 24px;gap:6px;align-items:center}
.spell.extra{grid-template-columns:1fr 70px 1fr auto 24px}
.spell.always input[type=text]{color:var(--gold2);font-weight:700}
.uses{display:flex;gap:4px;align-items:center;white-space:nowrap;font-size:14px;color:var(--muted)}
.uses input[type=number]{width:44px;text-align:center}
.sgroup{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.sglvl{font-family:var(--gothic);font-size:16px;color:var(--gold);border-bottom:1px solid var(--line)}
button.tag{font-size:13px;padding:1px 6px;min-height:0}
button.tag.on{background:linear-gradient(#e2bd62,#8a6420);border-color:#5e4313;color:#120d07}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot b{min-width:110px;font-family:var(--gothic);font-weight:400;font-size:17px;color:var(--gold2)}
.chk{display:flex;gap:4px}
.bond{display:flex;flex-direction:column;gap:5px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.bond .row{flex-wrap:nowrap}.bond .row input{font-family:var(--gothic);font-size:20px;color:var(--gold2)}
.stepper{display:flex;align-items:center;gap:3px;flex:none}
.stepper button{padding:2px 8px;min-width:34px;font-family:var(--body);font-weight:700}
.stepper .val{min-width:46px;text-align:center;font-family:var(--display);font-size:26px;color:var(--gold2);font-variant-numeric:tabular-nums}
.bond textarea{min-height:44px}
.bpval{font-family:var(--display);font-size:32px;color:var(--gold2);min-width:56px;text-align:right;font-variant-numeric:tabular-nums;flex:none;line-height:1}
.bstep{flex-wrap:nowrap}
.bstep button{min-width:46px;font-size:20px;font-family:var(--body);font-weight:700}
.bpamt{width:86px!important;text-align:center;flex:none;border:1px solid var(--line)!important}
.readbtn{grid-column:1/-1;justify-self:start;font-size:14px;padding:0 10px;min-height:0!important;background:none;border-color:var(--line);color:var(--gold)}
.readbtn.open{border-color:var(--gold2);color:var(--gold2)}
.sdesc{grid-column:1/-1}
.sdesc textarea{min-height:120px;font-size:16px;border-color:var(--gold);background:rgba(0,0,0,.4);white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-family:var(--gothic);font-size:15px;padding:1px 10px;border:1px solid var(--gold2);background:linear-gradient(#3a1018,#1a080c);color:var(--gold2);min-height:0}
.chip::before{content:"✠ ";color:var(--crimson)}
.chip.used{background:none;color:#6d6150;text-decoration:line-through;border-color:var(--line)}
.chip.used::before{content:"✓ ";color:#6d6150}
.perk{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.perk .row{flex-wrap:nowrap}.perk .row input{font-family:var(--gothic);font-size:18px;color:var(--gold2)}.perk textarea{min-height:44px}
.bp{width:76px;flex:none}.bp input{text-align:center;font-weight:700;color:var(--gold2)}
.train{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.train .row{flex-wrap:nowrap}.train .row input{font-family:var(--gothic);font-size:20px;color:var(--gold2)}
.trow{display:grid;grid-template-columns:62px 1fr 110px;gap:8px;align-items:center}
.bar{height:10px;border:1px solid var(--gold);background:#050405;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#e2bd62,#8a6420)}
.bar.ex i{background:linear-gradient(#b3203a,#5a0a15)}
.tn{display:flex;gap:4px;align-items:center;white-space:nowrap}.tn input{width:56px;text-align:center}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.coins .f input{text-align:center}
.note{font-size:14px;color:var(--muted);font-style:italic}
.note b{color:var(--gold2)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.foot{margin-top:26px;text-align:center;font-size:14px;color:var(--muted);font-style:italic}
.foot::before{content:"✠";display:block;color:var(--crimson);font-size:24px;text-shadow:0 0 10px rgba(142,20,38,.8)}
#printFrame{position:fixed;width:0;height:0;border:0;left:-9999px}
@media (max-width:640px){
  .card{border-radius:34px 34px 2px 2px/18px 18px 2px 2px;padding:18px 12px 18px}
  .card h2{font-size:27px}
  .tr.head{display:none}
  .tr.attack{grid-template-columns:1fr 1fr 30px;border:1px solid var(--line);padding:8px;background:rgba(0,0,0,.2)}
  .a-name{grid-column:1/3}.a-x{grid-column:3;grid-row:1}
  .a-dmg,.a-note{grid-column:1/4}
  .spell{grid-template-columns:28px 1fr 64px 28px!important}
  .spell.extra{grid-template-columns:1fr 64px 28px!important;border:1px solid var(--line);padding:6px;background:rgba(0,0,0,.2)}
  .spell.extra .x{grid-column:3;grid-row:1}
  .spell.extra .e-note{grid-column:1/3}
  .spell.extra .e-tags{grid-column:1/4}
  .acitem{grid-template-columns:auto 1fr 28px}
  .acitem .ai-type{grid-column:1/2}.acitem .ai-val{grid-column:2/3}.acitem .x{grid-column:3;grid-row:1}
  input[type=checkbox]{width:24px;height:24px}
  button{min-height:38px}
  button.x{min-height:0;font-size:24px}
  button.chip,button.tag{min-height:32px}
  input,select{padding:6px 7px}
  .hp{grid-template-columns:1fr 1fr}
  .row .hpamt{flex:1 1 100%;width:100%!important}
  .row button.dmg,.row button.heal{flex:1}
  .top-in{gap:6px}
  .top-in button,.top-in .btnlike{padding:5px 9px;font-size:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .meta{grid-template-columns:1fr 1fr}
  .bond .row input{flex:1;min-width:0}
  .stepper button{min-width:34px;padding:2px 4px}
  .stepper .val{min-width:38px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <span class="pill" id="saveState">Loading…</span>
    <span class="grow"></span>
    <button id="btnLong" title="Restore HP, slots, Lay on Hands and resources">Long rest</button>
    <button id="btnShort" title="Reset Channel Divinity">Short rest</button>
    <button id="btnExport" title="Save a backup file you can move to another device">Export</button>
    <label class="btnlike" for="importFile">Import</label><input id="importFile" type="file" accept=".json,application/json" hidden>
    <button id="btnPrint" class="primary">Print</button>
  </div>
</div>

<div class="scroll"><div id="app"></div></div>
<iframe id="printFrame" title="Print preview" aria-hidden="true"></iframe>

<script>
// ---------- default data: Rov at level 7 (from his Aurora sheet) ----------
const DEFAULT = {

  prof:3,
  abil:{str:{s:16,save:false},dex:{s:10,save:false},con:{s:16,save:false},int:{s:12,save:false},wis:{s:13,save:true},cha:{s:11,save:true}},
  skills:{
    acrobatics:{p:0,m:0},animal:{p:0,m:0},arcana:{p:0,m:0},athletics:{p:1,m:0},deception:{p:0,m:0},history:{p:0,m:0},
    insight:{p:2,m:0},intimidation:{p:0,m:0},investigation:{p:0,m:0},medicine:{p:1,m:0},nature:{p:0,m:1},perception:{p:0,m:1},
    performance:{p:0,m:0},persuasion:{p:0,m:0},religion:{p:1,m:0},sleight:{p:0,m:0},stealth:{p:0,m:0},survival:{p:2,m:0}
  },
  acItems:[{name:"Plate armor",type:"set",val:18,worn:true},{name:"Animated Shield",type:"add",val:2,worn:true}], acManual:"", initMisc:0, initNote:"Advantage", passiveMisc:0, speed:"30 ft", hpBase:67, hpBonus:10, hpCur:77, hpTemp:0, hitDice:"7d10", hdUsed:0,
  deathS:0, deathF:0, inspiration:false, exhaustion:0,
  spellAbility:"Charisma", slots:[{lvl:1,max:4,used:0},{lvl:2,max:3,used:0}],
  lay:{max:35,cur:35}, cd:{max:1,used:0}, sense:{max:1,used:0},
  attacks:[
    {name:"Warhammer",range:"5 ft",hit:"+6",dmg:"1d8+3 bludgeoning",note:"Versatile 1d10+3"},
    {name:"Trident",range:"20/60 ft",hit:"+6",dmg:"1d6+3 piercing +1d6 force",note:"Versatile 1d8+3 +1d6 force"},
    {name:"Sacred Flame",range:"60 ft",hit:"DC 11 Dex",dmg:"2d8 radiant",note:"Blessed Warrior cantrip"}
  ],

l above 1st.", "Protection from Evil and Good": "1 action · touch · concentration, up to 10 minutes · V, S, M (holy water or powdered silver and iron, used up)\nAberrations, celestials, elementals, fey, fiends and undead have disadvantage on attacks against the target, and can't charm, frighten or possess it. If it's already under such an effect, it gets advantage on any new save against it.", "Purify Food and Drink": "1 action (ritual) · 10 ft · instant · V, S\nAll ordinary food and drink in a 5-ft sphere is cleansed of poison and disease.", "Searing Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next melee weapon hit deals an extra 1d6 fire and sets the target alight. At the start of each of its turns it makes a Constitution save or takes 1d6 fire; a success, or anyone using an action to douse it, ends the spell. +1d6 initial damage for each slot level above 1st.", "Shield of Faith": "1 bonus action · 60 ft · concentration, up to 10 minutes · V, S, M (a small prayer parchment)\nA shimmering field gives one creature +2 AC.", "Speak with Animals": "1 action (ritual) · self · 10 minutes · V, S\nYou can understand and talk with beasts. Most know little beyond their surroundings and survival, but they may share what they've seen or help you.", "Thunderous Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next melee weapon hit rings out (heard 300 ft away) and deals an extra 2d6 thunder. The target makes a Strength save or is pushed 10 ft away and knocked prone.", "Wrathful Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next melee weapon hit deals an extra 1d6 psychic. The target makes a Wisdom save or is frightened of you until the spell ends; it can use an action to make a Wisdom check against your spell DC to steel itself.", "Aid": "1 action · 30 ft · 8 hours · V, S, M (a strip of white cloth)\nUp to three creatures each gain +5 to their maximum and current HP. +5 more for each slot level above 2nd. (Add it to the bonus max HP box.)", "Branding Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next weapon hit deals an extra 2d6 radiant. An invisible target becomes visible, and the target sheds dim light in 5 ft and can't turn invisible while the spell lasts. +1d6 for each slot level above 2nd.", "Find Steed": "10 minutes · 30 ft · instant · V, S\nA loyal spirit steed appears: a warhorse, pony, camel, elk or mastiff (your choice), with Intelligence 6 and the type celestial, fey or fiend. You share a telepathic bond within 1 mile, and spells you cast on yourself can also affect it. If it dies or is dismissed, cast again to recall it.", "Lesser Restoration": "1 action · touch · instant · V, S\nEnd one disease, or one of these conditions: blinded, deafened, paralyzed or poisoned.", "Locate Object": "1 action · self · concentration, up to 10 minutes · V, S, M (a forked twig)\nYou sense the direction of an object you're familiar with within 1,000 ft, or the nearest of a kind of object you've seen up close. Thin lead blocks it.", "Magic Weapon": "1 bonus action · touch · concentration, up to 1 hour · V, S\nA nonmagical weapon becomes a +1 magic weapon (bonus to attack and damage). +2 with a 4th-level slot, +3 with a 6th-level slot.", "Misty Step": "1 bonus action · self · instant · V\nWreathed in silver mist, you teleport up to 30 ft to an unoccupied space you can see.", "Moonbeam": "1 action · 120 ft · concentration, up to 1 minute · V, S, M (a moonseed leaf)\nA 5-ft-radius, 40-ft-high column of pale light. A creature entering it for the first time on a turn, or starting its turn there, makes a Constitution save: 2d10 radiant on a fail, half on a success. Shapechangers save with disadvantage and are forced back to their true form. Use an action to move the beam up to 60 ft. +1d10 for each slot level above 2nd.", "Protection from Poison": "1 action · touch · 1 hour · V, S\nNeutralize one poison affecting the creature. For the duration it has advantage on saves against being poisoned and resistance to poison damage.", "Zone of Truth": "1 action · 60 ft · 10 minutes · V, S\nA 15-ft-radius sphere. A creature entering it or starting its turn there makes a Charisma save or can't knowingly lie while inside. You know who passed and who failed. Affected creatures can still dodge questions or stay silent.", "Magic Missile": "1 action · 120 ft · instant · V, S\nThree glowing darts that always hit, each dealing 1d4 + 1 force. Aim them at one creature or split them. One more dart for each slot level above 1st. (Rov: once per day.)", "Beacon of Hope": "1 action · 30 ft · concentration, up to 1 minute · V, S\nAny number of creatures in range gain advantage on Wisdom saves and death saving throws, and whenever they're healed they regain the maximum possible HP. (Rov: once per day.)"};

const md = s => Math.floor(((Number(s)||0)-10)/2);
const sg = n => (n>=0?"+":"")+n;
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function get(path){return path.split(".").reduce((o,k)=>o?.[k],S)}
function set(path,v){const ks=path.split(".");let o=S;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=v}

// ---------- derived ----------
function skillTotal(k,ab){const sk=S.skills[k];return md(S.abil[ab].s)+(sk.p===1?S.prof:sk.p===2?S.prof*2:0)+(Number(sk.m)||0)}
function saveTotal(a){return md(S.abil[a].s)+(S.abil[a].save?S.prof:0)}
function unlocked(b,bi){const p=Number(b.points)||0;b.used=b.used||{};
  const got=S.perkTable.filter(k=>p>=(Number(k.at)||0)&&k.name).sort((a,b)=>a.at-b.at);
  const next=S.perkTable.filter(k=>p<(Number(k.at)||0)).sort((a,b)=>a.at-b.at)[0];
  const nm=k=>k.mystery&&p<(Number(k.at)||0)?"???":(k.mystery&&k.name==="???"?"Mystery perk":k.name);
  return `<div class="chips">${got.map(k=>`<button class="chip${b.used[k.name]?" used":""}" data-perkuse="${bi}" data-perk="${esc(k.name)}" title="${esc(k.desc)} — tap to mark used today">${esc(nm(k))}</button>`).join("")}${next?`<span class="note">next: ${esc(nm(next))} at ${next.at}</span>`:""}${got.length?`<span class="note">tap a perk when you use it</span>`:""}</div>`}
const LVORDER=["cantrip","1st","2nd","3rd","4th","5th","6th","7th","8th","9th"];
function lvlKey(l){const i=LVORDER.indexOf(String(l||"").trim().toLowerCase());return i<0?99:i}
function spellGroups(arr,key,row){
  const groups={};arr.forEach((x,i)=>{const g=String(x.lvl||"Other").trim()||"Other";(groups[g]=groups[g]||[]).push([x,i])});
  return Object.keys(groups).sort((a,b)=>lvlKey(a)-lvlKey(b)).map(g=>`<div class="sgroup"><div class="sglvl">${esc(/^cantrip/i.test(g)?"Cantrips":g+" level")}</div>${groups[g].map(([x,i])=>row(x,i)).join("")}</div>`).join("");
}
function hpMax(){return (Number(S.hpBase)||0)+(Number(S.hpBonus)||0)}
function acAuto(){const worn=S.acItems.filter(x=>x.worn);const sets=worn.filter(x=>x.type==="set").map(x=>Number(x.val)||0);
  const base=sets.length?Math.max(...sets):10+md(S.abil.dex.s);return base+worn.filter(x=>x.type==="add").reduce((t,x)=>t+(Number(x.val)||0),0)}
function acTotal(){const m=String(S.acManual??"").trim();return m!==""&&!isNaN(+m)?+m:acAuto()}
function passive(){return 10+skillTotal("perception","wis")+(Number(S.passiveMisc)||0)}
function spellDC(){return 8+S.prof+md(S.abil.cha.s)}

let focusId=null, caret=null;
function rerender(){
  dirty=false;
  const a=document.activeElement; focusId=a&&a.id||null;
  try{caret=a&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null}catch(e){caret=null}
  render();
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(caret)el.setSelectionRange(caret[0],caret[1])}catch(e){}}}
}
app.addEventListener("input",e=>{
  const t=e.target,k=t.dataset.k;
  if(t.classList.contains("bpamt")){bpAmt[t.dataset.i]=t.value;return}
  if(!k) return;
  if(t.type==="checkbox") return;
  if(t.tagName==="SELECT") return;
  let v=t.value; if(t.type==="number") v=v===""?0:Number(v);
  set(k,v); changed(false);
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.k&&t.type==="checkbox"){set(t.dataset.k,t.checked);changed(true);return}
  if(t.dataset.k&&t.tagName==="SELECT"){set(t.dataset.k,t.hasAttribute("data-str")?t.value:Number(t.value));changed(true);return}
  if(t.dataset.pip){const n=+t.dataset.n;set(t.dataset.pip,t.checked?n:n-1);changed(true);return}
  if(t.dataset.use){const o=get(t.dataset.use),n=+t.dataset.n;o.used=t.checked?n:n-1;changed(true);return}
});
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.hpact){
    const amt=Math.max(0,Math.floor(Number(document.getElementById("hpAmt").value)||0)); if(!amt) return;
    let cur=Number(S.hpCur)||0, tmp=Number(S.hpTemp)||0, max=hpMax();
    if(t.dataset.hpact==="dmg"){const fromTemp=Math.min(tmp,amt);tmp-=fromTemp;cur=Math.max(0,cur-(amt-fromTemp))}
    if(t.dataset.hpact==="heal"){cur=Math.min(max,cur+amt)}
    if(t.dataset.hpact==="temp"){tmp=Math.max(tmp,amt)}
    S.hpCur=cur;S.hpTemp=tmp;changed(true);
  }
  if(t.dataset.bp){const i=+t.dataset.bp,b=S.bondPts[i];const amt=Math.max(1,Math.floor(Number(bpAmt[i])||1));b.points=Math.max(0,(Number(b.points)||0)+Number(t.dataset.d)*amt);changed(true)}
  if(t.dataset.perkuse){const b=S.bondPts[+t.dataset.perkuse];b.used=b.used||{};b.used[t.dataset.perk]=!b.used[t.dataset.perk];changed(true)}
  if(t.dataset.read){const k=t.dataset.read;openSpell.has(k)?openSpell.delete(k):openSpell.add(k);rerender();return}
  if(t.dataset.toggle){set(t.dataset.toggle,!get(t.dataset.toggle));changed(true)}
  if(t.dataset.cycle){const v=get(t.dataset.cycle);set(t.dataset.cycle,(v+1)%3);changed(true)}
  if(t.dataset.del){openSpell.clear();const [arr,i]=t.dataset.del.split(".");S[arr].splice(+i,1);changed(true)}
  if(t.dataset.add){const blank={attacks:{name:"",range:"",hit:"",dmg:"",note:""},spells:{lvl:(document.getElementById("newSpellLvl")||{}).value||"1st",name:"",prep:false,always:false,desc:""},extraSpells:{lvl:"",name:"",note:"",always:false,uses:1,used:0,desc:""},features:{name:"New feature",text:""},allies:{name:"",rank:""},bondPts:{name:"",points:0,perks:"",used:{}},training:{name:"",normal:0,expert:0},perkTable:{at:0,name:"",desc:""},acItems:{name:"",type:"add",val:1,worn:true}}[t.dataset.add];S[t.dataset.add].push(blank);changed(true)}
});

const pill=document.getElementById("saveState");
function status(t,cls){pill.textContent=t;pill.className="pill "+(cls||"")}
let timer=null;
function changed(re){ if(re) rerender(); else softUpdate(); schedule(); }
let dirty=false;
function softUpdate(){ dirty=true; }
app.addEventListener("focusout",e=>{ if(!dirty) return; const to=e.relatedTarget; if(to&&app.contains(to)&&to.matches("input,textarea,select")) { dirty=false; setTimeout(rerender,0); return; } if(to&&app.contains(to)) return; dirty=false; setTimeout(rerender,0); });
function schedule(){ status("Unsaved…"); clearTimeout(timer); timer=setTimeout(save,700); }
function save(){
  try{localStorage.setItem("rov-sheet",JSON.stringify(S));status("Saved","ok")}
  catch(e){status("Couldn't save — use Export","bad")}
}
function merge(d){const base=JSON.parse(JSON.stringify(DEFAULT));
  if(d&&!d.extraSpells){delete d.spells;} // older saves: use the full paladin list and the new additional spells
  if(d&&d.hpBase==null){const old=Number(d.hpMax)||77;d.hpBase=old-10;d.hpBonus=10;delete d.hpMax}
  if(d&&!d.acItems){delete d.ac}
  if(d&&Array.isArray(d.extraSpells))d.extraSpells.forEach(x=>{if(x.uses==null){const n=String(x.name).toLowerCase();x.always=/druidcraft/.test(n);x.uses=/magic missile|beacon of hope/.test(n)?1:0;x.used=0}});
  if(d&&Array.isArray(d.bondPts))d.bondPts.forEach(b=>{b.used=b.used||{}});
  if(d&&Array.isArray(d.perkTable))base.perkTable.forEach(k=>{if(!d.perkTable.some(x=>x.name===k.name||Number(x.at)===k.at))d.perkTable.push(k)});
  ["spells","extraSpells"].forEach(k=>{if(d&&Array.isArray(d[k]))d[k].forEach(x=>{if(!x.desc)x.desc=SPELL_SUMMARY[x.name]||""})});
  return Object.assign(base,d)}
render();

<div class="st"><div><b>AC</b><span>${acTotal()}</span> ${S.acItems.filter(x=>x.worn).map(x=>esc(x.name)).join(", ")}</div><div><b>INITIATIVE</b><span>${sg(md(S.abil.dex.s)+(Number(S.initMisc)||0))}</span> ${esc(S.initNote)}</div><div><b>SPEED</b><span>${esc(S.speed)}</span></div><div><b>HIT POINTS</b><span>${esc(S.hpCur)} / ${hpMax()}</span>${S.hpTemp?" +"+esc(S.hpTemp)+" temp":""}</div><div><b>HIT DICE</b><span>${esc(S.hitDice)}</span></div></div>

<div><h2>SKILLS</h2><table>${sk}</table><p style="font-size:8pt;color:#5d554a">● proficient ◆ expertise · Passive Perception ${passive()}</p>
<h2>PROFICIENCIES & LANGUAGES</h2><div>${L(S.profLang)}</div>
<h2>RESOURCES</h2><div>Lay on Hands: ${esc(S.lay.cur)} / ${esc(S.lay.max)}<br>Channel Divinity: ${S.cd.max}/short rest<br>Divine Sense: ${S.sense.max}/long rest<br>${S.slots.map(s=>`Level ${s.lvl} slots: ${"○".repeat(s.max)}`).join("<br>")}<br>Spell save DC ${spellDC()} · Spell attack ${sg(S.prof+md(S.abil.cha.s))}</div>
</div>
<div><h2>ATTACKS</h2><table><tr><th>NAME</th><th>RANGE</th><th>HIT</th><th>DAMAGE</th><th>NOTES</th></tr>${S.attacks.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.range)}</td><td>${esc(a.hit)}</td><td>${esc(a.dmg)}</td><td>${esc(a.note)}</td></tr>`).join("")}</table>
<h2>PALADIN SPELLS</h2><table>${S.spells.slice().sort((a,b)=>lvlKey(a.lvl)-lvlKey(b.lvl)).map(s=>`<tr><td>${s.always?"●":s.prep?"◉":"○"}</td><td>${esc(s.name)}${s.always?" <small>(always prepared)</small>":""}</td><td>${esc(s.lvl)}</td></tr>`).join("")}</table>
<h2>ADDITIONAL SPELLS</h2><table>${S.extraSpells.slice().sort((a,b)=>lvlKey(a.lvl)-lvlKey(b.lvl)).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.lvl)}</td><td>${s.always?"Always":(Number(s.uses)||0)+"/day "+"○".repeat(Math.max(0,Number(s.uses)||0))}</td><td>${esc(s.note)}</td></tr>`).join("")}</table>
<h2>EQUIPMENT</h2><div class="two">${L(S.gear)}</div><p>Coins: ${["cp","sp","ep","gp","pp"].map(c=>S.coins[c]+" "+c).join(" · ")}</p>
<h2>MAGIC ITEMS</h2><div>${L(S.magic)}</div></div>
</div>
<div class="pg"></div>
${(()=>{const list=[...S.spells.filter(x=>x.prep||x.always),...S.extraSpells].filter(x=>x.desc);return list.length?`<h2>SPELL NOTES (prepared & additional)</h2><div class="two f">${list.map(x=>`<p><b>${esc(x.name)}.</b> ${L(x.desc)}</p>`).join("")}</div>`:""})()}
<h2>FEATURES & TRAITS</h2><div class="two f">${S.features.map(f=>`<p><b>${esc(f.name)}.</b> ${L(f.text)}</p>`).join("")}</div>
<div class="cols" style="grid-template-columns:1fr 1fr">
<div><h2>BOND POINTS</h2><table>${S.bondPts.map(b=>{const got=S.perkTable.filter(k=>(Number(b.points)||0)>=(Number(k.at)||0)&&k.name).map(k=>esc(k.mystery&&k.name==="???"?"Mystery perk":k.name)).join(", ");return `<tr><td><b>${esc(b.name)}</b>${got?` <small>(${got})</small>`:""}</td><td class="n">${esc(b.points)}</td></tr>${b.perks?`<tr><td colspan="2" style="font-size:9pt">${L(b.perks)}</td></tr>`:""}`}).join("")}</table>
<h2>BOND PERKS</h2><div class="f">${S.perkTable.slice().sort((a,b)=>a.at-b.at).map(k=>`<p><b>${esc(k.at)} · ${esc(k.name)}.</b> ${k.mystery?"Unknown until unlocked.":L(k.desc)}</p>`).join("")}</div>
<h2>SKILL TRAINING</h2><table><tr><th>NAME</th><th>TRAINING</th><th>EXPERT</th></tr>${S.training.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.normal)} / 90</td><td>${esc(t.expert)} / 10</td></tr>`).join("")}</table>
<h2>PERSONALITY</h2><div class="box"><b>Traits</b><br>${L(S.traits)}</div><div class="box"><b>Ideals</b><br>${L(S.ideals)}</div><div class="box"><b>Bonds</b><br>${L(S.bonds)}</div><div class="box"><b>Flaws</b><br>${L(S.flaws)}</div></div>
<div><h2>APPEARANCE</h2><div class="meta" style="grid-template-columns:repeat(3,1fr)">${Object.entries(S.look).map(([k,v])=>`<div><b>${k.toUpperCase()}</b>${esc(v)}</div>`).join("")}</div>
<h2>ALLIES & ORGANIZATIONS</h2><table>${S.allies.map(a=>`<tr><td>${esc(a.name)}</td><td class="n">${esc(a.rank)}</td></tr>`).join("")}</table>
<h2>COMPANIONS</h2><div>${L(S.companions)}</div>
${S.notes?`<h2>NOTES</h2><div>${L(S.notes)}</div>`:""}</div>
</div>
</body></html>`;
  const fr=document.getElementById("printFrame");
  fr.srcdoc=html;
  fr.onload=()=>{setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),600)}}},500)};
}
</script>
</body>
</html>
