<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borvo Rov</title>
<meta name="theme-color" content="#0b0a0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Fraktur";src:url(fonts/unifrakturmaguntia-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Pirata";src:url(fonts/pirata-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Garamond";src:url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Garamond";src:url(fonts/eb-garamond-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Garamond";src:url(fonts/eb-garamond-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
/* v9 · Gothic reliquary, alive: black stone, gold leaf, crimson glass, green-gold oath light. */
:root{
  --void:#0b0a0c; --ink:#e8dec8; --muted:#9a8d76; --line:#4a3f2c;
  --gold:#b48a32; --gold2:#e2bd62; --gold3:#f6dd95; --crimson:#8e1426; --blood:#5a0a15;
  --display:"Fraktur","UnifrakturMaguntia",serif; --gothic:"Pirata","Fraktur",serif; --body:"Garamond","EB Garamond",Georgia,serif;
  --read:Roboto,"Segoe UI",Arial,system-ui,sans-serif;
  --cut:12px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;background:var(--void);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-weight:400;margin:0}

/* ---------- living background ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .stone{position:absolute;inset:0;background:
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .4 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
  repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 2px,transparent 2px 90px),radial-gradient(ellipse at 50% -10%,#2a1a20,#0b0a0c 70%)}
.bg .glass{position:absolute;inset:-30%;opacity:.16;filter:blur(40px);
  background:radial-gradient(circle at 20% 30%,#8e1426 0 12%,transparent 30%),radial-gradient(circle at 75% 20%,#1d3f7a 0 10%,transparent 28%),
    radial-gradient(circle at 60% 70%,#b48a32 0 9%,transparent 26%),radial-gradient(circle at 30% 80%,#3a1c5c 0 10%,transparent 28%);
  animation:glass 70s ease-in-out infinite alternate}
@keyframes glass{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(6%,-4%) rotate(8deg)}100%{transform:translate(-5%,5%) rotate(-6deg)}}
.bg .candle{position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 45% at 50% 100%,rgba(255,170,70,.2),transparent 70%),radial-gradient(ellipse 50% 35% at 0% 40%,rgba(255,150,60,.1),transparent 70%),radial-gradient(ellipse 50% 35% at 100% 55%,rgba(255,150,60,.1),transparent 70%);
  animation:flicker 4.3s infinite}
@keyframes flicker{0%{opacity:.85}9%{opacity:1}14%{opacity:.78}22%{opacity:.95}31%{opacity:.88}43%{opacity:1}52%{opacity:.8}61%{opacity:.97}72%{opacity:.84}83%{opacity:1}91%{opacity:.9}100%{opacity:.85}}
.bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%)}
#amb{position:fixed;inset:0;z-index:1;pointer-events:none}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---------- header ---------- */
#shell{position:relative;z-index:2}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(rgba(10,8,11,.97),rgba(6,5,6,.95));border-bottom:1px solid var(--gold);
  box-shadow:0 1px 0 #000,0 6px 22px rgba(0,0,0,.9);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 14px 0}
.r1{display:flex;align-items:center;gap:10px}
.menuBtn{width:42px;height:42px;padding:0;font-size:20px;flex:none}
.brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-size:30px;line-height:1.1;
  background:linear-gradient(100deg,#9c7426 0%,#e2bd62 30%,#fff1c2 45%,#e2bd62 60%,#9c7426 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite;filter:drop-shadow(0 2px 0 #000)}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.acShield{position:relative;width:44px;height:50px;flex:none}
.acShield svg{position:absolute;inset:0}
.acShield b{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:6px;font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold3);text-shadow:0 2px 0 #000}
.acShield small{position:absolute;bottom:-3px;left:0;right:0;text-align:center;font-family:var(--gothic);font-size:10px;color:var(--gold)}
.r2{display:flex;align-items:center;gap:12px;margin-top:8px}
.miniHp{flex:1;height:14px;background:#050405;border:2px solid #050405;box-shadow:0 0 0 1px var(--gold);position:relative;overflow:hidden}
.miniHp i,.bigHp i{position:absolute;left:0;top:0;bottom:0;transition:width .5s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(rgba(255,210,210,.3),transparent 45%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#8e1426 0 22px,#b3203a 22px 36px,#5a0a15 36px 52px,#050405 52px 55px)}
.miniHp em,.bigHp em{position:absolute;top:0;bottom:0;background:linear-gradient(rgba(170,210,255,.85),rgba(80,120,200,.7));transition:all .5s}
.miniHp span{position:absolute;inset:0;font:600 10px/10px var(--read);display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.04em}
.slotsMini{display:flex;gap:8px;align-items:center;font-family:var(--gothic);font-size:13px;color:var(--gold)}
.slotsMini .g{display:flex;gap:3px;align-items:center}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:none;box-shadow:none;clip-path:none;padding:7px 9px 9px;font-family:var(--gothic);font-size:15px;color:var(--muted);position:relative;white-space:nowrap;letter-spacing:.03em;min-height:0}
.tab .ic{display:block;font-size:18px;line-height:1;margin-bottom:2px;font-family:var(--read)}
.tab.on{color:var(--gold3);text-shadow:0 0 12px rgba(226,189,98,.6);filter:none}
.tab.on::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);box-shadow:0 0 12px var(--gold2)}
.tab:active{transform:none}

/* ---------- menu ---------- */
.menu{position:fixed;top:calc(58px + env(safe-area-inset-top));left:12px;z-index:40;width:270px;padding:1px;display:none;
  background:linear-gradient(160deg,#f0cf78,#6b4f17 45%,#e2bd62);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.menu.open{display:block;animation:drop .22s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.menu .mi{background:linear-gradient(#1d191e,#110e12);clip-path:inherit;padding:8px}
.menu button,.menu label.mb{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;box-shadow:none;clip-path:none;border-bottom:1px solid rgba(180,138,50,.2);padding:10px 8px;font-family:var(--gothic);font-size:17px;color:var(--gold2);text-align:left;cursor:pointer;min-height:0}
.menu .ic{width:22px;text-align:center;font-family:var(--read)}
.menu .sw{margin-left:auto;width:38px;height:20px;border:1px solid var(--gold);position:relative;background:#0a0809;flex:none}
.menu .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--muted);transition:.2s}
.menu .sw.on{background:#3a2a10}.menu .sw.on::after{left:20px;background:var(--gold2);box-shadow:0 0 8px var(--gold2)}
.menu .st8{font:400 12.5px/1.5 var(--read);color:var(--muted);padding:8px 8px 2px}
.menu .st8 b{color:var(--gold2);font-weight:500}
.menu .st8 .bad{color:#ff8a8a}

/* ---------- base controls ---------- */
input,textarea,select{font:400 15.5px var(--read);color:var(--ink);background:rgba(0,0,0,.35);border:none;border-bottom:1px solid var(--line);border-radius:0;padding:6px 7px;width:100%;min-width:0}
select option{background:#151317;color:var(--ink)}
textarea{resize:vertical;min-height:70px;line-height:1.45;border:1px solid var(--line)}
input::placeholder,textarea::placeholder{color:#6d6150;font-style:italic}
input:focus,textarea:focus,select:focus{outline:none;border-bottom-color:var(--gold3);box-shadow:0 2px 10px -3px var(--gold2);background:rgba(180,138,50,.08)}
textarea:focus{border-color:var(--gold2)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--crimson);padding:0;flex:none}
input[type=number]{font-variant-numeric:tabular-nums}
button,.btnlike{font-family:var(--gothic);font-size:17px;letter-spacing:.03em;cursor:pointer;border:1px solid var(--gold);background:linear-gradient(#2c2529,#141115);color:var(--gold2);
  padding:6px 12px;min-height:38px;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);box-shadow:inset 0 1px 0 rgba(255,220,150,.22);transition:transform .08s,filter .15s}
button:active{transform:translateY(2px) scale(.97);filter:brightness(1.3)}
button:focus-visible{outline:1px solid var(--gold3);outline-offset:2px}
button.gold{background:linear-gradient(#f0cf78,#8a6420);border-color:#5e4313;color:#140e06}
button.red{background:linear-gradient(#6a1020,#2d0710);border-color:#d14a5e;color:#ffd6dc}
button.blue{background:linear-gradient(#1f3050,#0d1424);border-color:#6f93d6;color:#cfe0ff}
button.green{background:linear-gradient(#3d5a1c,#1a2a0b);border-color:#b9d36a;color:#eef7c8}
button.mini{padding:2px 12px;min-height:32px;font-size:16px}
button.x{border:none;background:none;box-shadow:none;clip-path:none;color:var(--muted);font:400 24px var(--body);padding:0 6px;line-height:1;min-height:0}
button.x:hover{color:#e05a6a}
button:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.f{display:flex;flex-direction:column;gap:2px}
.f label,.lbl{font-family:var(--gothic);font-size:15px;letter-spacing:.04em;color:var(--gold)}
.note{font:400 13.5px/1.45 var(--read);color:var(--muted)}
.note b{color:var(--gold2);font-weight:600}
.note .over{color:#ff8a8a}

/* ---------- panels ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 120px;display:grid;gap:16px;align-items:start}
@media (min-width:900px){.wrap.two{grid-template-columns:1fr 1fr}.wrap.two>.wide{grid-column:1/-1}}
.panel{position:relative;padding:1px;min-width:0;background:linear-gradient(160deg,#f0cf78,#6b4f17 35%,#b48a32 65%,#e9c56a);
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
.panel>.pi{position:relative;padding:16px 14px;clip-path:inherit;display:flex;flex-direction:column;gap:10px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .5 0 0 0 0 .35 0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 50% 0,rgba(142,20,38,.16),transparent 60%),linear-gradient(#1e1a1f,#121013);
  box-shadow:inset 0 0 0 4px rgba(18,16,19,.9),inset 0 0 0 5px rgba(180,138,50,.35),inset 0 0 50px rgba(0,0,0,.7)}
.panel>.pi::before,.panel>.pi::after{content:"◆";position:absolute;font-size:9px;color:var(--gold2);top:7px;font-family:var(--read)}
.panel>.pi::before{left:9px}.panel>.pi::after{right:9px}
.ph{display:flex;align-items:center;gap:10px;margin:0 0 2px;font-family:var(--display);font-size:26px;color:var(--gold2);text-shadow:0 2px 0 #000}
.ph::after{content:"";flex:1;height:3px;border-top:1px solid var(--gold);border-bottom:1px solid rgba(180,138,50,.35);
  background:linear-gradient(90deg,transparent 0,transparent 40%,rgba(255,240,190,.9) 50%,transparent 60%) no-repeat;background-size:300% 100%;animation:trim 6s linear infinite}
@keyframes trim{0%{background-position:150% 0}50%,100%{background-position:-150% 0}}
.ph .act{order:2;font-size:15px}
.sub2{font-family:var(--gothic);font-size:19px;color:var(--gold2);margin-top:6px;border-bottom:1px solid var(--line)}

/* ---------- gems ---------- */
.gem{width:11px;height:11px;transform:rotate(45deg);display:inline-block;flex:none;
  background:radial-gradient(circle at 30% 30%,#ffd1dc,#d23a5c 40%,#6b0c20);box-shadow:0 0 6px rgba(226,60,90,.7),inset 0 0 0 1px rgba(255,220,150,.6);animation:gempulse 3.2s ease-in-out infinite}
.gem.gold{background:radial-gradient(circle at 30% 30%,#fff6d0,#e2bd62 45%,#7a5a1b);box-shadow:0 0 6px rgba(226,189,98,.7),inset 0 0 0 1px rgba(255,240,200,.6)}
.gem.leaf{background:radial-gradient(circle at 30% 30%,#f4ffd0,#9fd36a 45%,#3d5a1c);box-shadow:0 0 6px rgba(185,224,106,.7),inset 0 0 0 1px rgba(240,255,200,.6)}
.gem.used{background:#1a1416;box-shadow:inset 0 0 0 1px #4a3f2c;animation:none}
.gem.flare{animation:flare .8s ease-out}
@keyframes gempulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes flare{0%{filter:brightness(3);transform:rotate(45deg) scale(1.9)}100%{filter:brightness(.3);transform:rotate(45deg) scale(1)}}
button.gemb{background:none;border:none;box-shadow:none;clip-path:none;padding:6px;min-height:0;display:inline-grid;place-items:center}
button.gemb .gem{width:20px;height:20px}
.gems{display:flex;flex-wrap:wrap;align-items:center;gap:2px}

/* ---------- vitals ---------- */
.vit{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.hpNum{font-family:var(--display);font-size:54px;line-height:.9;color:var(--gold3);text-shadow:0 3px 0 #000,0 0 22px rgba(226,189,98,.35)}
.hpNum small{font-size:26px;color:var(--gold)}
.hpTemp{font:500 13px var(--read);color:#a9c6ff;text-align:right}
.bigHp{position:relative;height:30px;background:#050405;border:3px solid #050405;box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(142,20,38,.45),inset 0 0 6px #000;overflow:hidden}
.bigHp::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(5,4,5,.9) 9px 10px),
  linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);background-size:auto,250% 100%;animation:glint 5s linear infinite}
@keyframes glint{0%{background-position:0 0,140% 0}100%{background-position:0 0,-140% 0}}
.amt{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.amt input{font:600 20px var(--read);text-align:center;border-bottom:1px solid var(--gold);padding:6px 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{text-align:center;padding:8px 2px 6px;background:rgba(0,0,0,.35);border:1px solid rgba(180,138,50,.35);display:flex;flex-direction:column;gap:2px;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.st b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--gold2);line-height:1.1}
.st span{font-family:var(--gothic);font-size:12px;color:var(--gold);letter-spacing:.05em}
.st small{font:400 11px var(--read);color:var(--muted)}
.st input{text-align:center;padding:2px}
.death{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid #d14a5e;background:rgba(142,20,38,.15)}
.death .lbl{color:#ffb3c0}
.pips{display:flex;gap:6px;align-items:center}
.auraWrap{position:relative;isolation:isolate;min-width:0}
.auraWrap::before{content:"";position:absolute;inset:-5px;z-index:-1;background:linear-gradient(135deg,#b9e06a,#f0cf78 40%,#8fd16a 70%,#f6dd95);filter:blur(12px);opacity:.35;animation:auraB 4.5s ease-in-out infinite}
@keyframes auraB{0%,100%{opacity:.22;transform:scale(.995)}50%{opacity:.6;transform:scale(1.01)}}
.auraWrap.out::before{animation:none;opacity:0}
.auraLine{font:500 13px var(--read);color:#cfe39a;text-align:center;text-shadow:0 0 10px rgba(185,224,106,.5)}
.auraWrap.out .auraLine{color:#8a7f6c;text-shadow:none}

/* ---------- concentration ---------- */
.conc{display:flex;align-items:center;gap:14px;padding:12px 14px;min-width:0;background:linear-gradient(90deg,rgba(226,189,98,.14),rgba(226,189,98,.03));border:1px solid rgba(226,189,98,.5);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);animation:drop .3s ease-out}
.rune{width:54px;height:54px;flex:none;animation:spin 14s linear infinite;filter:drop-shadow(0 0 6px rgba(226,189,98,.8))}
@keyframes spin{to{transform:rotate(360deg)}}
.conc .t{flex:1;min-width:0}
.conc .t b{display:block;font-family:var(--gothic);font-weight:400;font-size:19px;color:var(--gold3)}
.conc .t span{font:400 13.5px/1.35 var(--read);color:#d9ccb0}

/* ---------- conditions ---------- */
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.cchip{border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--muted);font:500 13.5px var(--read);padding:6px 10px;min-height:0;letter-spacing:0;box-shadow:none;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.cchip.on{border-color:#e05a6a;color:#ffe1e5;background:linear-gradient(#6a1020,#2d0710);box-shadow:0 0 14px rgba(224,90,106,.5)}
.condList{display:grid;gap:6px}
.cond{font:400 14px/1.45 var(--read);color:#e2d6bd;padding:8px 10px;border-left:3px solid #c2405a;background:rgba(142,20,38,.12);animation:drop .25s ease-out}
.cond b{color:#ffb3c0;font-weight:600}

/* ---------- attacks / spells-ready ---------- */
.atk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(180,138,50,.18)}
.atk:last-child{border-bottom:none}
.atk .n{font-family:var(--gothic);font-size:20px;color:var(--gold2)}
.atk .d{font:400 14px/1.4 var(--read);color:#d9ccb0}
.atk .d b{color:var(--gold3);font-weight:600}
.atk .btns{grid-row:span 2}
.atkEd{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px;padding:8px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.atkEd .a-name,.atkEd .a-dmg,.atkEd .a-note{grid-column:1/3}
.atkEd .a-x{grid-column:3;grid-row:1}
.ready{display:flex;flex-wrap:wrap;gap:6px}
.ready button{font-size:15px;padding:4px 10px;min-height:34px}
.ready button small{font:400 11px var(--read);color:var(--muted);margin-left:4px}
.meter{height:12px;background:#070607;border:1px solid var(--gold);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6c8a2a,#c9df7a,#f6edb0);box-shadow:0 0 10px #b9d36a;transition:width .5s}
.rl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--gothic);font-size:17px;color:var(--gold2)}
.rl span{font:500 14px var(--read);color:var(--muted)}
.slotRow{display:flex;align-items:center;gap:8px}
.slotRow .lv{font-family:var(--gothic);color:var(--gold);min-width:40px}

/* ---------- character ---------- */
.idname input{font-family:var(--display);font-size:clamp(40px,10vw,64px);text-align:center;background:none;border:none;color:var(--gold2);padding:0;
  text-shadow:0 2px 0 #000,0 0 24px rgba(226,189,98,.35)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.abils{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:640px){.abils{grid-template-columns:repeat(6,1fr)}}
.ab{display:flex;flex-direction:column;align-items:center;gap:4px}
.ab .sh{width:100%;max-width:132px;padding:3px;background:linear-gradient(160deg,#f0cf78,#7a5a1b 55%,#e2bd62);clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.ab .in{background:radial-gradient(ellipse at 50% 20%,#3a1018,#160a0d 75%);clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%);padding:8px 6px 36px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ab .lbl{font-size:13px;color:var(--gold2)}
.ab .mod{font-family:var(--display);font-size:34px;color:var(--gold2);line-height:1.05;text-shadow:0 2px 0 #000}
.ab input[type=number]{text-align:center;width:56px;border:1px solid var(--gold);background:rgba(0,0,0,.45)}
.ab .save{display:flex;align-items:center;gap:5px;font:400 13.5px var(--read);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.skills{display:grid;gap:1px}
.sk{display:grid;grid-template-columns:40px 1fr 50px 78px;gap:6px;align-items:center;padding:2px 4px;min-height:40px}
.sk:nth-child(odd){background:rgba(255,255,255,.03)}
.sk .tot{text-align:right;font:700 17px var(--read);color:var(--gold2)}
.sk .nm{font:400 15px var(--read)}
.sk .ab3{font-size:11px;color:var(--muted);letter-spacing:.05em}
.sk.p .nm,.sk.e .nm{font-weight:600;color:var(--gold3)}
.sk input{padding:3px;text-align:center}
.sk .prof{padding:2px 4px;font-size:14px;min-height:32px;display:flex;align-items:center;justify-content:center;gap:5px}
.sk .prof .pg{font-family:var(--read);font-size:15px;color:var(--muted)}
.sk .prof.on{border-color:var(--gold2)}.sk .prof.on .pg{color:#e2bd62}
.sk .prof.ex{background:linear-gradient(#e2bd62,#8a6420);border-color:#5e4313;color:#120d07}.sk .prof.ex .pg{color:#5a0a15}
.feat{border-left:2px solid var(--crimson);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.feat .row{flex-wrap:nowrap}
.feat .row input,.bond .row input,.perk .row input,.train .row input{font-family:var(--gothic);color:var(--gold2);font-size:19px}
.feats{display:grid;gap:12px}
@media (min-width:700px){.feats{grid-template-columns:1fr 1fr}}
.train{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.train .row{flex-wrap:nowrap}
.trow{display:grid;grid-template-columns:62px 1fr 110px;gap:8px;align-items:center}
.bar{height:10px;border:1px solid var(--gold);background:#050405;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#e2bd62,#8a6420)}
.bar.ex i{background:linear-gradient(#b3203a,#5a0a15)}
.tn{display:flex;gap:4px;align-items:center;white-space:nowrap;font:400 14px var(--read)}.tn input{width:56px;text-align:center}

/* ---------- spells ---------- */
.sgroup{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.sglvl{font-family:var(--gothic);font-size:17px;color:var(--gold);border-bottom:1px solid var(--line)}
.spell{display:grid;grid-template-columns:28px 1fr auto auto auto 26px;gap:5px;align-items:center}
.spell .readbtn{grid-column:auto;justify-self:stretch;padding:0 8px}
.spell.always input[type=text]{color:var(--gold2);font-weight:600}
.spell .castb{font-size:14px;padding:2px 10px;min-height:32px}
button.tag{font-size:13px;padding:2px 8px;min-height:30px}
button.tag.on{background:linear-gradient(#e2bd62,#8a6420);border-color:#5e4313;color:#120d07}
.readbtn{grid-column:1/-1;justify-self:start;font-size:14px;padding:0 10px;min-height:28px!important;background:none;border-color:var(--line);color:var(--gold)}
.readbtn.open{border-color:var(--gold2);color:var(--gold2)}
.sdesc{grid-column:1/-1}
.sdesc textarea{min-height:130px;font-size:15px;border-color:var(--gold);background:rgba(0,0,0,.4)}
.extra{display:grid;grid-template-columns:1fr 70px 28px;gap:6px;align-items:center;border:1px solid var(--line);padding:6px;background:rgba(0,0,0,.2)}
.extra .e-note{grid-column:1/3}.extra .x{grid-column:3;grid-row:1}
.extra .e-tags{grid-column:1/-1}
.extra.always input[type=text]{color:var(--gold2);font-weight:600}
.uses{display:flex;gap:6px;align-items:center;white-space:nowrap;font:400 14px var(--read);color:var(--muted)}
.uses input[type=number]{width:48px;text-align:center}

/* ---------- roleplay ---------- */
.allyRow{display:grid;grid-template-columns:1fr 70px 28px;gap:6px;align-items:center}
.bond{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bond .row{flex-wrap:nowrap}
.bpval{font-family:var(--display);font-size:32px;color:var(--gold2);min-width:56px;text-align:right;font-variant-numeric:tabular-nums;flex:none;line-height:1}
.bstep{flex-wrap:nowrap}
.bstep button{min-width:46px;font:700 20px var(--body)}
.bpamt{width:86px!important;text-align:center;flex:none;border:1px solid var(--line)!important}
.bond textarea,.perk textarea{min-height:44px}
.seals{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seal{position:relative;min-height:0;padding:6px 14px 6px 34px;font-family:var(--gothic);font-size:15px;color:#ffe6c8;letter-spacing:.03em;
  background:linear-gradient(#4a0b16,#2a060c);border:1px solid #c2405a;box-shadow:0 0 10px rgba(194,64,90,.35)}
.seal::before{content:"";position:absolute;left:7px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#e0485f,#8e1426 60%,#4a0710);box-shadow:0 0 0 2px #5a0a15,0 0 8px rgba(224,72,95,.7),inset 0 0 0 3px rgba(255,180,190,.25)}
.seal.used{color:#7d7060;background:#17110f;border-color:#4a3f2c;box-shadow:none;text-decoration:line-through}
.seal.used::before{background:radial-gradient(circle at 38% 35%,#6a4a4f,#3a2a2c 60%,#211617);box-shadow:0 0 0 2px #2a1d1e;
  -webkit-mask-image:linear-gradient(115deg,#000 46%,transparent 47%,transparent 53%,#000 54%);mask-image:linear-gradient(115deg,#000 46%,transparent 47%,transparent 53%,#000 54%)}
.perk{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.perk .row{flex-wrap:nowrap}
.bp{width:76px;flex:none}.bp input{text-align:center;font-weight:700;color:var(--gold2)}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.coins input{text-align:center}
.acitem{display:grid;grid-template-columns:auto 1fr 28px;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.acitem .ai-type{grid-column:1/2}.acitem .ai-val{grid-column:2/3}.acitem .x{grid-column:3;grid-row:1}
.wear{min-width:78px;font-size:15px}
.wear.on{background:linear-gradient(#e2bd62,#8a6420);border-color:#5e4313;color:#120d07}

/* ---------- camp ---------- */
.treats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.treat{width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#ffe7a8,#d99a3e 55%,#8a5520);box-shadow:inset 0 -3px 0 rgba(90,50,10,.5),0 0 10px rgba(240,190,100,.45)}
.treat::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 60%,#6b3a12 0 2px,transparent 3px),radial-gradient(circle at 62% 40%,#6b3a12 0 2px,transparent 3px),radial-gradient(circle at 55% 72%,#6b3a12 0 2px,transparent 3px)}
.treat.gone{background:#1a1416;box-shadow:inset 0 0 0 1px #4a3f2c}.treat.gone::after{display:none}
.logE{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);background:rgba(0,0,0,.22);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.logE .hd{display:grid;grid-template-columns:auto 70px 1fr auto;gap:8px;align-items:center}
.logE .hd .lbl{font-size:18px;color:var(--gold2)}
.logE .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.delb.armed{color:#fff;background:linear-gradient(#a3192f,#5a0a15);border:1px solid #e05a6a;clip-path:none;font:500 13px var(--read);padding:4px 8px}
.foot{margin:10px 0 0;text-align:center;font:italic 400 13.5px var(--read);color:var(--muted)}
.foot::before{content:"✠";display:block;color:var(--crimson);font-size:24px;font-style:normal;text-shadow:0 0 10px rgba(142,20,38,.8)}


/* spell text, style E */
.sE{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid rgba(180,138,50,.45);background:rgba(0,0,0,.28)}
.sE-tags{display:flex;flex-wrap:wrap;gap:5px}
.sT{font:600 11.5px var(--read);letter-spacing:.02em;padding:2px 7px;border-radius:2px;background:#5e4313;color:#fff1c2}
.sT.c{background:#8e1426;color:#ffe9c0}
.sE-sum{margin:0;font:500 15.5px/1.4 var(--read);color:#f3e7cc}
.sE-plain{margin:0;font:400 14px/1.5 var(--read);color:#d9ccb0;white-space:pre-wrap}
.sE details{font:400 14px/1.45 var(--read);color:#d9ccb0;border-top:1px dashed rgba(180,138,50,.45);padding-top:6px}
.sE summary{cursor:pointer;color:var(--gold2);font-weight:600;font-size:13.5px}
.sE ol{margin:6px 0 4px;padding-left:20px}.sE li{margin:3px 0}
.sE-up{font-size:13.5px;background:rgba(142,20,38,.18);border-left:3px solid #c2405a;padding:5px 8px;margin-top:6px}
.sE-up b{color:#ffb3c0}
.sE-needs{font-size:12.5px;color:var(--muted);margin-top:5px}
.muted{color:var(--muted)}
.dlg .sE{background:rgba(255,255,255,.3);border-color:#b89d68;margin-bottom:10px}
.dlg .sT{background:#8a6420;color:#fff6dc}.dlg .sT.c{background:#7a1020}
.dlg .sE-sum{color:#2a1d10}.dlg .sE-plain,.dlg .sE details{color:#4a3a24}.dlg .sE summary{color:#8a6420}
.dlg .sE-up{background:rgba(122,16,32,.08);border-left-color:#7a1020}.dlg .sE-up b{color:#7a1020}.dlg .sE-needs{color:#6a5434}
.prepCard{padding:6px 0 2px}

/* ---------- dialogs (parchment) ---------- */
.dlgBack{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px}
.dlgBack.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{width:100%;max-width:440px;padding:2px;background:linear-gradient(160deg,#8a6420,#e2bd62 40%,#6b4f17);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);animation:rise .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(20px) scale(.96);opacity:0}}
.dlg .di{clip-path:inherit;padding:18px 18px 16px;color:#2a1d10;max-height:86vh;overflow-y:auto;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .3 0 0 0 0 .15 0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 50% 40%,#efe2c4,#d6c194 85%,#b89d68)}
.dlg h3{margin:0 0 4px;font-family:var(--gothic);font-size:26px;color:#7a1020}
.dlg .sub{font:400 14px/1.5 var(--read);color:#4a3a24;margin-bottom:10px;white-space:pre-wrap}
.dlg .warn{font:500 13.5px/1.45 var(--read);color:#7a1020;background:rgba(142,20,38,.1);border-left:3px solid #8e1426;padding:6px 10px;margin-bottom:10px}
.lvls{display:flex;gap:8px;margin:6px 0 10px}
.lvl{flex:1;padding:8px 4px;border:1px solid #7a5a1b;background:rgba(255,255,255,.35);font:600 15px var(--read);color:#3a2a14;min-height:0;letter-spacing:0;box-shadow:none}
.lvl small{display:block;font-weight:400;font-size:12px;color:#6a5434}
.lvl.on{background:linear-gradient(#8e1426,#5a0a15);color:#ffe9c0;border-color:#3a0610}
.lvl.on small{color:#f0cf9a}
.lvl:disabled{opacity:.35}
.dmg{font:400 15px/1.5 var(--read);color:#2a1d10;background:rgba(255,255,255,.35);border-left:3px solid #8e1426;padding:8px 10px;margin-bottom:10px}
.dmg b{font-size:22px;color:#7a1020}
.dchk{display:flex;align-items:center;gap:8px;font:400 14.5px var(--read);margin-bottom:10px}
.dlgBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.dlg input[type=text],.dlg input:not([type]),.dlg input[type=number]{color:#2a1d10;background:rgba(255,255,255,.55);border:1px solid #7a5a1b;margin-bottom:10px}
.dlg input[type=number]{flex:1}
.dlg [data-srroll]{flex:none;white-space:nowrap;padding:8px 12px}
.prep{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:start;padding:5px 0;border-bottom:1px solid rgba(122,90,27,.25)}
.prep input{margin-top:2px}
.prep details summary{font:500 15.5px var(--read);color:#2a1d10;cursor:pointer;list-style:none}
.prep details summary::after{content:" ▾";font-size:11px;color:#8a6420}
.prep details[open] summary::after{content:" ▴"}

.prep.locked summary{color:#7a5a1b}
.prepLvl{font-family:var(--gothic);font-size:18px;color:#7a1020;margin:10px 0 2px}
.prepCount{position:sticky;top:-18px;z-index:1;margin:0 -18px 6px;padding:8px 18px;background:#e6d6b2;border-bottom:1px solid #b89d68;font:600 15px var(--read);color:#3a2a14}
.prepCount.over{color:#a3192f}

/* ---------- effect overlays ---------- */
.ov{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0}
#ovHurt{background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(160,10,30,.75) 100%)}
#ovHurt.go{animation:hurt .7s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}
#ovLow{background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(150,0,25,.6) 100%)}
#ovLow.on{animation:beat 1.25s infinite}
@keyframes beat{0%{opacity:.15}12%{opacity:.85}24%{opacity:.25}36%{opacity:.7}60%{opacity:.15}100%{opacity:.15}}
#ovSmite{background:radial-gradient(circle at 50% 45%,rgba(255,250,225,1) 0,rgba(255,225,140,.85) 25%,rgba(226,189,98,.35) 55%,transparent 80%)}
#ovSmite.go{animation:smite .9s ease-out}
#ovSmite.go.holy{animation:smite 1.4s ease-out}
@keyframes smite{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
#ovDawn{background:linear-gradient(to top,rgba(255,140,60,.75),rgba(255,205,120,.45) 35%,rgba(150,180,255,.12) 70%,transparent);transform:translateY(100%)}
#ovDawn.go{animation:dawn 2.6s ease-in-out}
@keyframes dawn{0%{opacity:0;transform:translateY(100%)}35%{opacity:1;transform:translateY(0)}70%{opacity:.8}100%{opacity:0;transform:translateY(-20%)}}
#sun{position:fixed;left:50%;bottom:-140px;width:220px;height:220px;margin-left:-110px;border-radius:50%;z-index:56;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff6d8 0,#ffd27a 35%,rgba(255,170,70,0) 70%)}
#sun.go{animation:sun 2.6s ease-in-out}
@keyframes sun{0%{opacity:0;transform:translateY(0)}40%{opacity:1;transform:translateY(-55vh)}100%{opacity:0;transform:translateY(-70vh)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.slam{animation:slam .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes slam{0%{transform:none}15%{transform:translateY(10px) scale(.985)}35%{transform:translate(-6px,-4px)}55%{transform:translate(5px,3px)}75%{transform:translate(-3px,0)}100%{transform:none}}
/* smite: Amara */
#goldGlow{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 35%,rgba(255,236,170,.95),rgba(240,190,80,.75) 40%,rgba(160,105,25,.55) 75%,rgba(60,35,5,.5))}
#goldGlow::before{content:"";position:absolute;left:50%;top:32%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;opacity:.28;filter:blur(6px);
  background:repeating-conic-gradient(from 0deg,rgba(255,250,225,.6) 0deg 3deg,transparent 7deg 20deg,rgba(255,250,225,.6) 24deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 45%);mask-image:radial-gradient(circle,#000 0,transparent 45%)}
#goldGlow.go{animation:gGlow 3.6s ease-in-out forwards}
#goldGlow.go::before{animation:rays 3.6s linear forwards}
@keyframes gGlow{0%{opacity:0}30%{opacity:.8}50%{opacity:.9}78%{opacity:.6}100%{opacity:0}}
@keyframes rays{from{transform:rotate(0)}to{transform:rotate(25deg)}}
#amara{position:fixed;left:50%;top:3vh;width:min(100vw,480px);aspect-ratio:1;margin-left:calc(min(100vw,480px) / -2);z-index:59;pointer-events:none;opacity:0}
#amara img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.25) brightness(1.08) contrast(.95);
  -webkit-mask-image:radial-gradient(ellipse 48% 52% at 50% 40%,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse 48% 52% at 50% 40%,#000 25%,transparent 72%)}
#amara .credit{position:absolute;bottom:16%;right:20%;font:400 9px var(--read);color:rgba(255,240,200,.6)}
#amara.go{animation:amIn 3.6s ease-in-out forwards}
@keyframes amIn{0%{opacity:0;transform:translateY(16px) scale(1.06);filter:blur(10px)}45%{opacity:.78;transform:none;filter:blur(1px)}70%{opacity:.7;filter:blur(1.5px)}100%{opacity:0;transform:translateY(-12px) scale(1.03);filter:blur(9px)}}
#beam{position:fixed;left:50%;top:18vh;width:90px;margin-left:-45px;height:52vh;z-index:61;pointer-events:none;opacity:0;transform-origin:top;
  background:linear-gradient(90deg,transparent,rgba(255,225,150,.55) 30%,rgba(255,252,235,1) 50%,rgba(255,225,150,.55) 70%,transparent);filter:blur(2px)}
#beam.holy{width:150px;margin-left:-75px}
#beam.go{animation:beam 3.6s ease-out forwards}
@keyframes beam{0%,40%{opacity:0;transform:scaleY(0)}45%{opacity:1;transform:scaleY(1)}62%{opacity:.8}82%,100%{opacity:0;transform:scaleY(1)}}
.ring{position:fixed;left:50%;top:70vh;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;z-index:61;pointer-events:none;opacity:0;
  border:3px solid rgba(255,235,170,.95);box-shadow:0 0 20px 6px rgba(255,210,110,.8),inset 0 0 20px 4px rgba(255,210,110,.6)}
.ring.go{animation:ring 1.1s ease-out forwards}
@keyframes ring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(14)}}
#dmgTxt{position:fixed;left:0;right:0;top:calc(70vh - 40px);text-align:center;z-index:64;pointer-events:none;opacity:0;
  font-family:var(--display);font-size:68px;line-height:1;color:#fff6d6;-webkit-text-stroke:1.5px #6b4a0e;text-shadow:0 0 10px rgba(255,230,160,1),0 0 30px rgba(255,190,70,.95),0 0 70px rgba(255,160,40,.7)}
#dmgTxt small{display:block;font-family:var(--gothic);font-size:22px;-webkit-text-stroke:0;color:#fff1c4;letter-spacing:.2em;margin-top:4px}
#dmgTxt.go{animation:dmgIn 3.6s ease-out forwards}
@keyframes dmgIn{0%,44%{opacity:0;transform:scale(2.2)}50%{opacity:1;transform:scale(.95)}55%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#ovWhite{background:#fffbe8}
#ovWhite.go{animation:white 1s ease-out}
@keyframes white{0%{opacity:0}10%{opacity:.95}100%{opacity:0}}

/* smite against undead or fiends: darkness first, then a cross of white-silver judgement */
#ovDark{background:radial-gradient(ellipse at 50% 45%,rgba(8,0,12,.62) 0%,rgba(14,0,20,.88) 45%,rgba(22,34,6,.85) 78%,rgba(20,0,28,.98) 100%)}
#ovDark.go{animation:dark 4.4s ease-out forwards}
@keyframes dark{0%{opacity:0}10%{opacity:1}31%{opacity:1}35%{opacity:0}100%{opacity:0}}
#goldGlow.holy{background:radial-gradient(ellipse 90% 70% at 50% 40%,rgba(255,255,255,.98),rgba(220,236,255,.85) 35%,rgba(170,200,240,.6) 65%,rgba(40,50,80,.55))}
#goldGlow.holy.go{animation:hGlow 4.4s ease-in-out forwards}
#goldGlow.holy.go::before{animation:hRays 4.4s cubic-bezier(.2,.7,.3,1) forwards}

const SPELL_OLD = {"Sacred Flame": "1 action · 60 ft · instant · V, S\nA flame of radiance falls on a creature you can see. It makes a Dexterity save (cover doesn't help) or takes 2d8 radiant damage at Rov's level (1d8 at levels 1–4, 3d8 from 11, 4d8 from 17).", "Spare the Dying": "1 action · touch · instant · V, S\nA living creature at 0 HP becomes stable. Does nothing to undead or constructs.", "Druidcraft": "1 action · 30 ft · instant · V, S\nSmall nature magic: predict the weather for the next 24 hours, make a flower bloom or a seed pod open, create a harmless sensory effect (falling leaves, a breeze, an animal sound, a faint smell), or light or put out a candle, torch or small campfire.", "Bless": "1 action · 30 ft · concentration, up to 1 minute · V, S, M (holy water)\nUp to three creatures add 1d4 to their attack rolls and saving throws while it lasts. One more creature for each slot level above 1st.", "Ceremony": "1 hour (ritual) · touch · instant · V, S, M (25 gp of powdered silver, used up)\nPerform one rite: Atonement (DC 20 Insight to restore a willing creature's alignment), Bless Water (a vial becomes holy water), Coming of Age (+1d4 to one ability check within 24 hours), Dedication (+1d4 to saves for 24 hours), Funeral Rite (a corpse can't become undead for 7 days), or Wedding (the couple gain +2 AC while within 30 ft of each other for 7 days).", "Command": "1 action · 60 ft · 1 round · V\nSpeak a one-word command. The target makes a Wisdom save or follows it on its next turn — e.g. approach, drop, flee, grovel, halt. No effect on undead, on creatures that don't understand you, or if the order is directly harmful to it. One more creature for each slot level above 1st.", "Compelled Duel": "1 bonus action · 30 ft · concentration, up to 1 minute · V\nA creature makes a Wisdom save or is drawn to fight you: it has disadvantage on attacks against anyone but you, and must save again to move more than 30 ft away from you. Ends if you attack someone else, cast a spell on another enemy, an ally harms the target, or you end your turn more than 30 ft from it.", "Cure Wounds": "1 action · touch · instant · V, S\nA creature regains 1d8 + your spellcasting modifier HP (1d8 for Rov at Charisma +0). +1d8 for each slot level above 1st. No effect on undead or constructs.", "Detect Evil and Good": "1 action · self · concentration, up to 10 minutes · V, S\nYou know whether an aberration, celestial, elemental, fey, fiend or undead is within 30 ft and where it is, and sense consecrated or desecrated places. Blocked by 1 ft of stone, 1 inch of metal, thin lead, or 3 ft of wood or earth.", "Detect Magic": "1 action (ritual) · self · concentration, up to 10 minutes · V, S\nYou sense magic within 30 ft. Use an action to see the faint aura around a magical creature or object and learn its school of magic. Same blockers as Detect Evil and Good.", "Detect Poison and Disease": "1 action (ritual) · self · concentration, up to 10 minutes · V, S, M (a yew leaf)\nYou sense poisons, poisonous or venomous creatures, and diseases within 30 ft, and learn what kind each is. Same blockers as Detect Evil and Good.", "Divine Favor": "1 bonus action · self · concentration, up to 1 minute · V, S\nYour weapon attacks deal an extra 1d4 radiant damage on a hit.", "Ensnaring Strike": "1 bonus action · self · concentration, up to 1 minute · V\nThe next time you hit with a weapon, thorny vines grab the target: Strength save (advantage if Large or bigger) or it's restrained. While restrained it takes 1d6 piercing at the start of each of its turns. It, or a creature that can reach it, can use an action to make a Strength check against your spell DC to tear free. +1d6 for each slot level above 1st.", "Heroism": "1 action · touch · concentration, up to 1 minute · V, S\nA willing creature can't be frightened and gains temporary HP equal to your spellcasting modifier at the start of each of its turns (0 for Rov at Charisma +0). One more creature for each slot level above 1st.", "Protection from Evil and Good": "1 action · touch · concentration, up to 10 minutes · V, S, M (holy water or powdered silver and iron, used up)\nAberrations, celestials, elementals, fey, fiends and undead have disadvantage on attacks against the target, and can't charm, frighten or possess it. If it's already under such an effect, it gets advantage on any new save against it.", "Purify Food and Drink": "1 action (ritual) · 10 ft · instant · V, S\nAll ordinary food and drink in a 5-ft sphere is cleansed of poison and disease.", "Searing Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next melee weapon hit deals an extra 1d6 fire and sets the target alight. At the start of each of its turns it makes a Constitution save or takes 1d6 fire; a success, or anyone using an action to douse it, ends the spell. +1d6 initial damage for each slot level above 1st.", "Shield of Faith": "1 bonus action · 60 ft · concentration, up to 10 minutes · V, S, M (a small prayer parchment)\nA shimmering field gives one creature +2 AC.", "Speak with Animals": "1 action (ritual) · self · 10 minutes · V, S\nYou can understand and talk with beasts. Most know little beyond their surroundings and survival, but they may share what they've seen or help you.", "Thunderous Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next melee weapon hit rings out (heard 300 ft away) and deals an extra 2d6 thunder. The target makes a Strength save or is pushed 10 ft away and knocked prone.", "Wrathful Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next melee weapon hit deals an extra 1d6 psychic. The target makes a Wisdom save or is frightened of you until the spell ends; it can use an action to make a Wisdom check against your spell DC to steel itself.", "Aid": "1 action · 30 ft · 8 hours · V, S, M (a strip of white cloth)\nUp to three creatures each gain +5 to their maximum and current HP. +5 more for each slot level above 2nd. (Add it to the bonus max HP box.)", "Branding Smite": "1 bonus action · self · concentration, up to 1 minute · V\nYour next weapon hit deals an extra 2d6 radiant. An invisible target becomes visible, and the target sheds dim light in 5 ft and can't turn invisible while the spell lasts. +1d6 for each slot level above 2nd.", "Find Steed": "10 minutes · 30 ft · instant · V, S\nA loyal spirit steed appears: a warhorse, pony, camel, elk or mastiff (your choice), with Intelligence 6 and the type celestial, fey or fiend. You share a telepathic bond within 1 mile, and spells you cast on yourself can also affect it. If it dies or is dismissed, cast again to recall it.", "Lesser Restoration": "1 action · touch · instant · V, S\nEnd one disease, or one of these conditions: blinded, deafened, paralyzed or poisoned.", "Locate Object": "1 action · self · concentration, up to 10 minutes · V, S, M (a forked twig)\nYou sense the direction of an object you're familiar with within 1,000 ft, or the nearest of a kind of object you've seen up close. Thin lead blocks it.", "Magic Weapon": "1 bonus action · touch · concentration, up to 1 hour · V, S\nA nonmagical weapon becomes a +1 magic weapon (bonus to attack and damage). +2 with a 4th-level slot, +3 with a 6th-level slot.", "Misty Step": "1 bonus action · self · instant · V\nWreathed in silver mist, you teleport up to 30 ft to an unoccupied space you can see.", "Moonbeam": "1 action · 120 ft · concentration, up to 1 minute · V, S, M (a moonseed leaf)\nA 5-ft-radius, 40-ft-high column of pale light. A creature entering it for the first time on a turn, or starting its turn there, makes a Constitution save: 2d10 radiant on a fail, half on a success. Shapechangers save with disadvantage and are forced back to their true form. Use an action to move the beam up to 60 ft. +1d10 for each slot level above 2nd.", "Protection from Poison": "1 action · touch · 1 hour · V, S\nNeutralize one poison affecting the creature. For the duration it has advantage on saves against being poisoned and resistance to poison damage.", "Zone of Truth": "1 action · 60 ft · 10 minutes · V, S\nA 15-ft-radius sphere. A creature entering it or starting its turn there makes a Charisma save or can't knowingly lie while inside. You know who passed and who failed. Affected creatures can still dodge questions or stay silent.", "Magic Missile": "1 action · 120 ft · instant · V, S\nThree glowing darts that always hit, each dealing 1d4 + 1 force. Aim them at one creature or split them. One more dart for each slot level above 1st. (Rov: once per day.)", "Beacon of Hope": "1 action · 30 ft · concentration, up to 1 minute · V, S\nAny number of creatures in range gain advantage on Wisdom saves and death saving throws, and whenever they're healed they regain the maximum possible HP. (Rov: once per day.)"};
const SPELL_SUMMARY = {"Sacred Flame": "1 action · 60 ft · instant\nA creature you can see makes a DEX save (DC {dc}) or takes 2d8 radiant.\n- Pick a creature you can see within 60 ft.\n- It makes a Dexterity save against DC {dc}; cover doesn't help it.\n- On a fail it takes 2d8 radiant damage (1d8 at levels 1–4, 3d8 from 11th, 4d8 from 17th).\nNeeds: V, S", "Spare the Dying": "1 action · touch · instant\nTouch a living creature at 0 HP: it becomes stable.\n- Touch a creature that is at 0 hit points.\n- It stops making death saves and is stable.\n- Does nothing to undead or constructs.\nNeeds: V, S", "Druidcraft": "1 action · 30 ft · instant\nA small touch of nature magic: weather, blooms, scents, or a little flame.\n- Predict the weather here for the next 24 hours, or\n- make a flower bloom, a seed pod open or a leaf bud open, or\n- create a harmless sensory effect: falling leaves, a breeze, an animal sound, a faint smell, or\n- light or put out a candle, torch or small campfire.\nNeeds: V, S", "Bless": "1 action · 30 ft · 1 minute · concentration\nUp to 3 allies add +1d4 to attack rolls and saving throws.\n- Pick up to 3 creatures within 30 ft (Rov can include himself).\n- Until it ends, each of them rolls an extra d4 and adds it to every attack roll and saving throw.\nNeeds: V, S, M (a sprinkle of holy water)\nCast higher: +1 creature for each slot level above 1st (2nd level: 4 creatures).", "Ceremony": "1 hour · touch · ritual\nPerform one holy rite on a creature or object.\n- Atonement: a willing creature makes an Insight check (DC 20) to restore its alignment.\n- Bless Water: a vial of water becomes holy water.\n- Coming of Age: a young adult adds +1d4 to one ability check in the next 24 hours.\n- Dedication: someone joining your faith adds +1d4 to one saving throw in the next 24 hours.\n- Funeral Rite: a corpse can't become undead for 7 days.\n- Wedding: the couple gain +2 AC while within 30 ft of each other, for 7 days.\nNeeds: V, S, M (25 gp of powdered silver, used up)", "Command": "1 action · 60 ft · 1 round\nOne word: the target makes a WIS save (DC {dc}) or obeys on its next turn.\n- Speak a one-word command to a creature you can see, e.g. Approach, Drop, Flee, Grovel, Halt.\n- It makes a Wisdom save against DC {dc}; on a fail it follows the command on its next turn.\n- No effect on undead, on a creature that doesn't understand you, or if the order would directly harm it.\nNeeds: V\nCast higher: +1 creature for each slot level above 1st (they must be within 30 ft of each other).", "Compelled Duel": "1 bonus action · 30 ft · 1 minute · concentration\nForce one enemy to fight you: WIS save (DC {dc}) or it focuses on Rov.\n- Target a creature you can see; it makes a Wisdom save against DC {dc}.\n- On a fail it has disadvantage on attacks against anyone but Rov.\n- It must make the save again to move more than 30 ft away from Rov.\n- It ends if Rov attacks or casts on someone else, an ally harms the target, or Rov ends a turn more than 30 ft away.\nNeeds: V", "Cure Wounds": "1 action · touch · instant\nTouch a creature: it heals 1d8 {mod} HP.\n- Touch a living creature (not undead or a construct).\n- It regains 1d8 hit points plus Rov's Charisma ({mod}).\nNeeds: V, S\nCast higher: +1d8 for each slot level above 1st (2nd level: 2d8 {mod}).", "Detect Evil and Good": "1 action · self · 10 minutes · concentration\nSense aberrations, celestials, elementals, fey, fiends and undead within 30 ft.\n- For the duration you know if one of those creature types is within 30 ft, and where it is.\n- You also sense places or objects within 30 ft that are consecrated or desecrated.\n- Blocked by 1 ft of stone, 1 inch of metal, thin lead, or 3 ft of wood or earth.\nNeeds: V, S", "Detect Magic": "1 action · self · 10 minutes · concentration · ritual\nSense magic within 30 ft and see its aura.\n- For the duration you sense whether magic is within 30 ft.\n- Use your action to see a faint aura around a magical creature or object you can see, and learn its school of magic.\n- Same blockers as Detect Evil and Good.\nNeeds: V, S", "Detect Poison and Disease": "1 action · self · 10 minutes · concentration · ritual\nSense poisons, poisonous creatures and diseases within 30 ft.\n- You sense the presence and location of each one within 30 ft.\n- You also learn what kind of poison, creature or disease it is.\n- Same blockers as Detect Evil and Good.\nNeeds: V, S, M (a yew leaf)", "Divine Favor": "1 bonus action · self · 1 minute · concentration\nYour weapon hits deal an extra 1d4 radiant.\n- Until it ends, every weapon attack that hits deals +1d4 radiant damage.\nNeeds: V, S", "Ensnaring Strike": "1 bonus action · self · 1 minute · concentration\nNext weapon hit: vines grab the target (STR save DC {dc}) and deal 1d6 each turn.\n- Cast it as a bonus action, then hit with a weapon attack.\n- The target makes a Strength save against DC {dc} (advantage if it's Large or bigger). On a fail it's restrained.\n- While restrained it takes 1d6 piercing at the start of each of its turns.\n- It, or a creature next to it, can use an action to make a Strength check against DC {dc} to tear free.\nNeeds: V\nCast higher: +1d6 damage per turn for each slot level above 1st (2nd level: 2d6).", "Heroism": "1 action · touch · 1 minute · concentration\nA willing creature is fearless and gains {mod} temp HP each turn.\n- Touch a willing creature: it can't be frightened while the spell lasts.\n- At the start of each of its turns it gains temporary HP equal to Rov's Charisma ({mod}).\n- When the spell ends, those temporary HP are lost.\nNeeds: V, S\nCast higher: +1 creature for each slot level above 1st.", "Protection from Evil and Good": "1 action · touch · 10 minutes · concentration\nA creature is protected from aberrations, celestials, elementals, fey, fiends and undead.\n- Those creature types have disadvantage on attack rolls against the target.\n- They can't charm, frighten or possess it.\n- If it's already charmed, frightened or possessed by one, it has advantage on any new save against that effect.\nNeeds: V, S, M (holy water or powdered silver and iron, used up)", "Purify Food and Drink": "1 action · 10 ft · instant · ritual\nClean all ordinary food and drink in a 5-ft sphere of poison and disease.\n- Pick a point within 10 ft; everything nonmagical to eat or drink within 5 ft of it is made safe.\nNeeds: V, S", "Searing Smite": "1 bonus action · self · 1 minute · concentration\nNext melee hit: +1d6 fire and the target catches fire (CON save DC {dc} each turn).\n- Cast it as a bonus action, then hit with a melee weapon attack.\n- The hit deals an extra 1d6 fire damage and sets the target ablaze.\n- At the start of each of its turns it makes a Constitution save against DC {dc}: on a fail it takes 1d6 fire; on a success the spell ends.\n- The target or a creature next to it can use an action to put the flames out.\nNeeds: V\nCast higher: +1d6 to the first hit for each slot level above 1st.", "Shield of Faith": "1 bonus action · 60 ft · 10 minutes · concentration\nOne creature gets +2 AC.\n- Pick a creature within 60 ft; a shimmering field gives it +2 to Armor Class.\nNeeds: V, S, M (a small parchment with holy text)", "Speak with Animals": "1 action · self · 10 minutes · ritual\nTalk with beasts and understand them.\n- For the duration you can understand and speak with beasts.\n- Most know little beyond their surroundings and survival, but they may tell you what they've seen or do a small favour.\nNeeds: V, S", "Thunderous Smite": "1 bonus action · self · 1 minute · concentration\nNext melee hit: +2d6 thunder; STR save (DC {dc}) or pushed 10 ft and knocked prone.\n- Cast it as a bonus action, then hit with a melee weapon attack.\n- The hit rings out (heard 300 ft away) and deals an extra 2d6 thunder damage.\n- The target makes a Strength save against DC {dc}: on a fail it's pushed 10 ft away and knocked prone.\nNeeds: V", "Wrathful Smite": "1 bonus action · self · 1 minute · concentration\nNext melee hit: +1d6 psychic; WIS save (DC {dc}) or frightened of Rov.\n- Cast it as a bonus action, then hit with a melee weapon attack.\n- The hit deals an extra 1d6 psychic damage.\n- The target makes a Wisdom save against DC {dc}: on a fail it's frightened of Rov until the spell ends.\n- It can use an action to make a Wisdom check against DC {dc} to steel itself and end the effect.\nNeeds: V", "Aid": "1 action · 30 ft · 8 hours\nUp to 3 creatures get +5 max HP and +5 current HP.\n- Pick up to 3 creatures within 30 ft (Rov can include himself).\n- Each one's maximum HP and current HP go up by 5 for 8 hours.\n- For Rov: add it to the bonus max HP box.\nNeeds: V, S, M (a strip of white cloth)\nCast higher: +5 more HP for each slot level above 2nd.", "Branding Smite": "1 bonus action · self · 1 minute · concentration\nNext weapon hit: +2d6 radiant and the target glows and can't turn invisible.\n- Cast it as a bonus action, then hit with a weapon attack.\n- The hit deals an extra 2d6 radiant damage.\n- An invisible target becomes visible; it sheds dim light in 5 ft and can't turn invisible until the spell ends.\nNeeds: V\nCast higher: +1d6 for each slot level above 2nd.", "Find Steed": "10 minutes · 30 ft · instant\nSummon a loyal spirit steed.\n- A warhorse, pony, camel, elk or mastiff appears (your choice), with Intelligence 6; it's a celestial, fey or fiend.\n- It obeys you and you share a telepathic link within 1 mile.\n- Spells you cast on yourself can also affect it while it's within 5 ft.\n- If it dies or you dismiss it, cast the spell again to bring it back.\nNeeds: V, S", "Lesser Restoration": "1 action · touch · instant\nEnd one disease or one condition: blinded, deafened, paralyzed or poisoned.\n- Touch a creature and end one disease, or one of those conditions, affecting it.\nNeeds: V, S", "Locate Object": "1 action · self · 10 minutes · concentration\nSense the direction of an object within 1,000 ft.\n- Name an object you know well, or the nearest of a kind of object you've seen up close.\n- While it's within 1,000 ft you know which direction it is in.\n- A thin sheet of lead blocks the spell.\nNeeds: V, S, M (a forked twig)", "Magic Weapon": "1 bonus action · touch · 1 hour · concentration\nA nonmagical weapon becomes +1 to attack and damage.\n- Touch a weapon that isn't magical; it counts as a +1 magic weapon until the spell ends.\nNeeds: V, S\nCast higher: +2 with a 4th-level slot, +3 with a 6th-level slot.", "Misty Step": "1 bonus action · self · instant\nTeleport up to 30 ft to a spot you can see.\n- Wrapped in silver mist, you vanish and appear in an unoccupied space within 30 ft that you can see.\nNeeds: V", "Moonbeam": "1 action · 120 ft · 1 minute · concentration\nA column of moonlight: CON save (DC {dc}) or 2d10 radiant, half on a success.\n- A 5-ft-radius, 40-ft-high cylinder of pale light appears within 120 ft.\n- A creature entering it for the first time on a turn, or starting its turn there, makes a Constitution save against DC {dc}.\n- Fail: 2d10 radiant damage; success: half.\n- Shapechangers save with disadvantage and are forced into their true form.\n- On later turns, use your action to move the beam up to 60 ft.\nNeeds: V, S, M (a moonseed leaf)\nCast higher: +1d10 for each slot level above 2nd.", "Protection from Poison": "1 action · touch · 1 hour\nCure one poison and guard against more.\n- Touch a creature and neutralize one poison affecting it.\n- For an hour it has advantage on saves against being poisoned and resistance to poison damage.\nNeeds: V, S", "Zone of Truth": "1 action · 60 ft · 10 minutes\nIn a 15-ft sphere, creatures make a CHA save (DC {dc}) or can't lie.\n- Pick a point within 60 ft; the zone is a 15-ft-radius sphere around it.\n- A creature entering it or starting its turn there makes a Charisma save against DC {dc}; on a fail it can't knowingly lie while inside.\n- You know who passed and who failed.\n- Affected creatures can still dodge questions or stay silent.\nNeeds: V, S", "Magic Missile": "1 action · 120 ft · instant · 1/day\nThree darts that always hit, 1d4 + 1 force each.\n- Choose one or more creatures you can see within 120 ft.\n- Fire three glowing darts at them in any split; each hits automatically for 1d4 + 1 force damage.\nNeeds: V, S\nCast higher: +1 dart for each slot level above 1st (Rov casts it once a day without a slot).", "Beacon of Hope": "1 action · 30 ft · 1 minute · concentration · 1/day\nAllies get advantage on WIS and death saves, and healing on them is maxed.\n- Choose any number of creatures within 30 ft.\n- They have advantage on Wisdom saves and death saving throws.\n- Whenever they regain hit points, they regain the maximum possible amount.\nNeeds: V, S"};

const md = s => Math.floor(((Number(s)||0)-10)/2);
const sg = n => (n>=0?"+":"")+n;

// ---------- derived ----------
function level(){const m=String(S.classLevel||"").match(/\d+/);return m?Math.max(1,+m[0]):7}
function skillTotal(k,ab){const sk=S.skills[k];return md(S.abil[ab].s)+(sk.p===1?S.prof:sk.p===2?S.prof*2:0)+(Number(sk.m)||0)}
function saveTotal(a){return md(S.abil[a].s)+(S.abil[a].save?S.prof:0)}
function hpMax(){return (Number(S.hpBase)||0)+(Number(S.hpBonus)||0)}
function hpCur(){return Number(S.hpCur)||0}
function acAuto(){const worn=S.acItems.filter(x=>x.worn);const sets=worn.filter(x=>x.type==="set").map(x=>Number(x.val)||0);
  const base=sets.length?Math.max(...sets):10+md(S.abil.dex.s);return base+worn.filter(x=>x.type==="add").reduce((t,x)=>t+(Number(x.val)||0),0)}
function acTotal(){const m=String(S.acManual??"").trim();return m!==""&&!isNaN(+m)?+m:acAuto()}
function passive(){return 10+skillTotal("perception","wis")+(Number(S.passiveMisc)||0)}
function spellDC(){return 8+S.prof+md(S.abil.cha.s)}
function prepLimit(){return Math.max(1,md(S.abil.cha.s)+Math.floor(level()/2))}
function prepCount(){return S.spells.filter(x=>x.prep&&!x.always&&!/cantrip/i.test(x.lvl)).length}
function auraBonus(){return Math.max(1,md(S.abil.cha.s))}
const LVORDER=["cantrip","1st","2nd","3rd","4th","5th","6th","7th","8th","9th"];
function lvlKey(l){const i=LVORDER.indexOf(String(l||"").trim().toLowerCase());return i<0?99:i}
function lvlNum(l){if(/cantrip/i.test(l))return 0;const n=parseInt(l);return isNaN(n)?1:n}
const ORD=n=>n+(n===1?"st":n===2?"nd":n===3?"rd":"th");
function isConc(sp){return /concentration/i.test(sp.desc||"")}
function spellGroups(arr,row){
  const groups={};arr.forEach((x,i)=>{const g=String(x.lvl||"Other").trim()||"Other";(groups[g]=groups[g]||[]).push([x,i])});
  return Object.keys(groups).sort((a,b)=>lvlKey(a)-lvlKey(b)).map(g=>`<div class="sgroup"><div class="sglvl">${esc(/^cantrip/i.test(g)?"Cantrips":g+" level")}</div>${groups[g].map(([x,i])=>row(x,i)).join("")}</div>`).join("")}


// ---------- spell text, style E: tags + one line, full text behind a tap ----------
function fillNums(t){return String(t||"").replace(/\{dc\}/g,spellDC()).replace(/\{mod\}/g,sg(md(S.abil.cha.s)))}
function parseSpell(desc){const L=fillNums(desc).split("\n").map(l=>l.trim()).filter(Boolean);
  if(L.length<2||!L[0].includes("·"))return {plain:L.join("\n")};
  const o={tags:L[0].split(/\s*·\s*/).filter(Boolean),sum:L[1],steps:[],needs:"",up:"",extra:[]};
  L.slice(2).forEach(l=>{if(/^[-•]\s*/.test(l))o.steps.push(l.replace(/^[-•]\s*/,""));else if(/^needs:/i.test(l))o.needs=l.replace(/^needs:\s*/i,"");else if(/^cast higher:/i.test(l))o.up=l.replace(/^cast higher:\s*/i,"");else o.extra.push(l)});
  return o}
function spellCard(desc,open){if(!desc)return `<div class="sE"><p class="sE-sum muted">No description yet.</p></div>`;const o=parseSpell(desc);
  if(o.plain!=null)return `<div class="sE"><p class="sE-plain">${esc(o.plain)}</p></div>`;
  const full=o.steps.length||o.needs||o.up||o.extra.length;
  return `<div class="sE"><div class="sE-tags">${o.tags.map(t=>`<span class="sT${/concentration/i.test(t)?" c":""}">${esc(t)}</span>`).join("")}</div>
    <p class="sE-sum">${esc(o.sum)}</p>
    ${full?`<details${open?" open":""}><summary>Full text</summary>${o.steps.length?`<ol>${o.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}${o.extra.map(x=>`<p class="sE-plain">${esc(x)}</p>`).join("")}${o.up?`<div class="sE-up"><b>Cast higher:</b> ${esc(o.up)}</div>`:""}${o.needs?`<div class="sE-needs">Needs: ${esc(o.needs)}</div>`:""}</details>`:""}</div>`}
function printDesc(desc){const o=parseSpell(desc);if(o.plain!=null)return esc(o.plain).replace(/\n/g,"<br>");
  return `<i>${esc(o.tags.join(" · "))}</i>. ${esc(o.sum)}${o.steps.length?"<br>"+o.steps.map(x=>"• "+esc(x)).join("<br>"):""}${o.up?"<br><i>Cast higher:</i> "+esc(o.up):""}`}
const editSpell=new Set();
const SPELL_HINT="Line 1: tags separated by ·  ·  Line 2: the one-line summary  ·  lines starting with - are the steps  ·  Needs: …  ·  Cast higher: …  ·  {dc} and {mod} fill in Rov's spell DC and Charisma.";
function spellPanel(key,desc){return `<div class="sdesc">${spellCard(desc,false)}
  <div class="row" style="margin-top:6px"><button class="mini" data-editspell="${key}">${editSpell.has(key)?"Done editing":"✎ Edit text"}</button></div>
  ${editSpell.has(key)?`${ta(key+".desc",8,"Write what this spell does")}<div class="note">${SPELL_HINT}</div>`:""}</div>`}

const inp=(path,type="text",extra="")=>`<input id="i_${path.replace(/\./g,'_')}" data-k="${path}" type="${type}" value="${esc(get(path))}" ${extra}>`;
const ta=(path,rows=4,ph="")=>`<textarea id="i_${path.replace(/\./g,'_')}" data-k="${path}" rows="${rows}"${ph?` placeholder="${esc(ph)}"`:""}>${esc(get(path))}</textarea>`;
const fld=(label,path,type,extra)=>`<div class="f"><label for="i_${path.replace(/\./g,'_')}">${label}</label>${inp(path,type,extra)}</div>`;
const panel=(title,body,cls="",act="")=>`<section class="panel ${cls}"><div class="pi"><h2 class="ph">${title}${act}</h2>${body}</div></section>`;
function gemRow(path,kind=""){const o=get(path);let h="";const left=o.max-o.used;
  for(let k=0;k<o.max;k++)h+=`<button class="gemb" data-gem="${path}" data-k="${k}" aria-label="${k<left?"Use":"Restore"} one"><i class="gem ${kind} ${k<left?"":"used"}" data-g="${path}:${k}"></i></button>`;
  return `<span class="gems">${h||'<span class="note">none</span>'}</span>`}
function pips(path,n){let h="";for(let i=1;i<=n;i++)h+=`<input type="checkbox" data-pip="${path}" data-n="${i}" ${get(path)>=i?"checked":""} aria-label="${path} ${i}">`;return `<span class="pips">${h}</span>`}

  g.fillStyle="#e2bd62";for(let x=34;x<W-30;x+=22){diamond(g,x,18);diamond(g,x,H-18)}for(let y=34;y<H-30;y+=22){diamond(g,18,y);diamond(g,W-18,y)}
  // faint embroidered rose in the middle
  g.save();g.translate(W/2,H/2);g.globalAlpha=.55;g.strokeStyle="#d9b25a";g.lineWidth=1.6;
  for(let r=0;r<6;r++){g.rotate(Math.PI/3);g.beginPath();g.ellipse(0,-22,15,22,0,0,Math.PI*2);g.stroke()}
  for(let r=0;r<5;r++){g.rotate(Math.PI*2/5);g.beginPath();g.ellipse(0,-12,9,12,0,0,Math.PI*2);g.stroke()}
  g.beginPath();g.arc(0,0,6,0,7);g.stroke();g.restore();

function diamond(g,x,y){g.beginPath();g.moveTo(x,y-3);g.lineTo(x+3,y);g.lineTo(x,y+3);g.lineTo(x-3,y);g.closePath();g.fill()}
// draw the blanket with its bottom-right corner pulled to T (blanket-local coords), shifted by D
function drawBlanket(T,D,time){bx.setTransform(DPR,0,0,DPR,0,0);bx.clearRect(0,0,W,H);if(!T)return;
  const C={x:W,y:H};let nx=C.x-T.x,ny=C.y-T.y;const len=Math.hypot(nx,ny);
  bx.translate(D.x,D.y);
  if(len<1){bx.drawImage(tex,0,0,W,H);return}
  nx/=len;ny/=len;const M={x:(C.x+T.x)/2,y:(C.y+T.y)/2},dx=-ny,dy=nx,F=3000;
  // wavy fold line: cloth ripple along the fold
  const pts=[];for(let i=-40;i<=40;i++){const s=i/40*F*.5,w=(Math.sin(s*.03+time*.011)+.5*Math.sin(s*.075-time*.017))*Math.min(11,len*.05)*Math.exp(-Math.abs(s)/500);pts.push({x:M.x+dx*s+nx*w,y:M.y+dy*s+ny*w})}
  const half=(side)=>{bx.beginPath();bx.moveTo(pts[0].x,pts[0].y);for(const p of pts)bx.lineTo(p.x,p.y);
    const e=pts[pts.length-1],f=pts[0];bx.lineTo(e.x+side*nx*F,e.y+side*ny*F);bx.lineTo(f.x+side*nx*F,f.y+side*ny*F);bx.closePath()};
  // 1. the flat part, front side
  bx.save();bx.beginPath();bx.rect(0,0,W,H);bx.clip();half(-1);bx.clip();bx.drawImage(tex,0,0,W,H);
  // shadow cast by the folded flap
  const sh=bx.createLinearGradient(M.x,M.y,M.x-nx*60,M.y-ny*60);sh.addColorStop(0,"rgba(0,0,0,.55)");sh.addColorStop(1,"rgba(0,0,0,0)");bx.fillStyle=sh;bx.fillRect(-F,-F,F*2,F*2);bx.restore();
  // 2. the folded flap, back side (gold satin lining), mirrored over the fold
  const k=2*(M.x*nx+M.y*ny);
  bx.save();bx.transform(1-2*nx*nx,-2*nx*ny,-2*nx*ny,1-2*ny*ny,k*nx,k*ny);
  bx.beginPath();bx.rect(0,0,W,H);bx.clip();half(1);bx.clip();
  bx.shadowColor="rgba(0,0,0,.6)";bx.shadowBlur=24;
  const lg=bx.createLinearGradient(M.x,M.y,C.x,C.y);lg.addColorStop(0,"#d9707f");lg.addColorStop(.12,"#a3263a");lg.addColorStop(.45,"#6e0e1e");lg.addColorStop(1,"#3a050d");
  bx.fillStyle=lg;bx.fillRect(-F,-F,F*2,F*2);
  // satin sheen bands
  bx.shadowBlur=0;for(let i=1;i<4;i++){const q=bx.createLinearGradient(M.x+nx*i*40,M.y+ny*i*40,M.x+nx*(i*40+18),M.y+ny*(i*40+18));q.addColorStop(0,"rgba(255,245,210,0)");q.addColorStop(.5,"rgba(255,200,210,.16)");q.addColorStop(1,"rgba(255,245,210,0)");bx.fillStyle=q;bx.fillRect(-F,-F,F*2,F*2)}
  bx.strokeStyle="#c9a24a";bx.lineWidth=5;bx.strokeRect(2,2,W-4,H-4);
  bx.restore();
  // highlight along the fold edge
  bx.save();bx.beginPath();bx.rect(0,0,W,H);bx.clip();bx.beginPath();bx.moveTo(pts[0].x,pts[0].y);for(const p of pts)bx.lineTo(p.x,p.y);bx.strokeStyle="rgba(255,190,200,.45)";bx.lineWidth=3;bx.stroke();bx.restore();
  // the gold tassel at the pulled corner
  bx.save();bx.translate(T.x,T.y);bx.fillStyle="#e2bd62";bx.beginPath();bx.arc(0,0,5,0,7);bx.fill();
  bx.strokeStyle="#c9a24a";bx.lineWidth=1.4;for(let i=-3;i<=3;i++){bx.beginPath();bx.moveTo(0,3);bx.quadraticCurveTo(i*2,10,i*2.4,16+Math.sin(time*.02+i)*1.5);bx.stroke()}bx.restore();
}

const bz3=(a,b,c,d,t)=>{const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d};
const lerp=(a,b,t)=>a+(b-a)*t, easeIn=t=>t*t*t, easeOut=t=>1-Math.pow(1-t,3), easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function arrive(){
  clearTimeout(idleT);cancelAnimationFrame(raf);tex=makeTex();
  if(isCalm()){drawBlanket(null);N.className="";place();return}
  flying=true;body.classList.add("intro");N.className="fly";N.classList.remove("right");
  const p=perch(),C={x:W,y:H};
  const A={x:W*.18,y:H*.22};             // where the corner is pulled to before the yank
  const t0=performance.now();let lx=W+80,ly=H*.55,last=t0;
  drawBlanket({x:W,y:H},{x:0,y:0},0);
  function step(now){const t=now-t0;let x,y,s=1.5,T=null,D={x:0,y:0};
    if(t<650){// fly in to the corner
      const k=easeOut(t/650);x=lerp(W+80,C.x-14,k);y=lerp(H*.55,C.y-26,k)+Math.sin(k*Math.PI)*-40;T={x:W,y:H};N.className="fly"}
    else if(t<900){// grab the tassel and tug twice
      const k=(t-650)/250,tug=Math.sin(k*Math.PI*2)*10;T={x:W-14-tug,y:H-14-tug};x=T.x-8;y=T.y-6;N.className="glide";if(t-last>120){if(UI.vib&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}last=t}}
    else if(t<2700){// one continuous pull: the corner travels from bottom-right, through the top-left corner and out;
      // the cloth folds over behind her and follows her off the screen (no separate yank)
      const k=(t-900)/1800,e=Math.pow(k,1.35);
      const ex=-W*1.08,ey=-H*1.08;                      // past the top-left: the whole blanket has folded over by here
      const sx=bz3(W-14,W*.62,W*.12,ex,e),sy=bz3(H-14,H*.5,H*.02,ey,e);
      T={x:sx,y:sy};x=sx-8;y=sy-6;s=lerp(1.5,1.7,k);N.className="fly"}
    else if(t<3000){// both gone; a beat of quiet
      drawBlanket(null);T=null;x=-200;y=-200}
    else if(t<3950){// she comes back without it and settles beside the name
      const k=easeOut((t-3000)/950);x=bz3(-40,W*.3,p.x+60,p.x,k);y=bz3(H*.22,H*.42,p.y+70,p.y,k);s=lerp(1.3,1,k);
      N.className=k>.82?"glide right":"fly right"}
    else{drawBlanket(null);return land()}
    if(T)drawBlanket(T,D,t);
    const dx=x-lx,dy=y-ly;lx=x;ly=y;state.x=x;state.y=y;state.s=s;state.rot=Math.max(-22,Math.min(22,Math.atan2(dy,Math.abs(dx)+.01)*30));
    if(t>1500)body.classList.remove("intro");
    if(Math.random()<.4)feather(x,y-10,1,"mote");
    draw();raf=requestAnimationFrame(step)}
  raf=requestAnimationFrame(step);
}
function land(){flying=false;body.classList.remove("intro");N.className="land right";place();const p=perch();feather(p.x,p.y-20,8,"feather");

function act(a){if(flying||isCalm())return;

function scheduleIdle(){clearTimeout(idleT);idleT=setTimeout(()=>{act(ACTS[Math.floor(Math.random()*ACTS.length)]);scheduleIdle()},3200+Math.random()*4500)}
(function blink(){clearTimeout(blinkT);blinkT=setTimeout(()=>{if(!isCalm()&&!flying){N.classList.add("blink");setTimeout(()=>N.classList.remove("blink"),130)}blink()},2200+Math.random()*3500)})();
